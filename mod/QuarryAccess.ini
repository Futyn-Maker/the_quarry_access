; QuarryAccess — screen-reader accessibility mod for The Quarry.
; This file lives in <game>\SMG026\Binaries\Win64\Mods\QuarryAccess\QuarryAccess.ini
; Lines starting with ';' are comments. Values are read once at game start.

[General]
; Full | Normal | Minimal — how much is said when focus moves in menus.
Verbosity=Full
; auto = follow the game's text language; or a locale code such as ru_RU, en_US.
Language=auto
; Say a greeting with the detected screen reader and language at startup.
SpeakOnLoad=1
; Error | Info | Verbose | Trace
LogLevel=Info
; Also write Mods\QuarryAccess\QuarryAccess.log (in addition to UE4SS.log).
LogFile=1

[Hotkeys]
; Keyboard keys. Modifiers: Ctrl+, Alt+, Shift+ (e.g. Ctrl+F9). Empty disables a hotkey.
; Leave F10, F11 and F12 alone: F10 is the Windows menu-bar key and freezes the game until Escape,
; F11 switches the game between full screen and a window, F12 is the Steam screenshot key.
Repeat=F5
ReadScreen=F6
Stop=F7
Help=F8
Subtitles=F9
LastSubtitle=F4
; Exploration: the next and the previous thing to walk to, where the target is now, walking
; there by itself, and the beacon on or off.
NextTarget=N
PreviousTarget=P
Where=H
Walk=G
Beacon=T
DevDumpTree=Ctrl+F9
DevTrace=Ctrl+F10
DevLogLevel=Ctrl+F11
; Gamepad chords: hold ChordHold and press one of the buttons below. While ChordHold is down
; the game sees no button, so a chord is never also a press for the game. The buttons all sit
; under the right thumb, so a chord takes one hand on each side of the pad.
ChordHold=Gamepad_Special_Left
ChordRepeat=Gamepad_FaceButton_Bottom
ChordReadScreen=Gamepad_FaceButton_Left
ChordStop=Gamepad_FaceButton_Right
ChordHelp=Gamepad_FaceButton_Top
ChordSubtitles=Gamepad_RightTrigger
ChordLastSubtitle=Gamepad_RightShoulder

; While the player walks the character freely the game leaves these buttons unused, so the
; exploration keys answer them there without the chord.
ExploreNext=Gamepad_DPad_Right
ExplorePrevious=Gamepad_DPad_Left
ExploreWhere=Gamepad_DPad_Up
ExploreWalk=Gamepad_FaceButton_Left
ExploreBeacon=Gamepad_DPad_Down

[Speech]
; How long the same text is ignored when focus lands on it again.
FocusDedupeMs=150

[Sounds]
; Volume of the cues the mod plays itself, 0 to 100; 0 turns them off. A rising two-note tone
; marks a choice committing or a challenge won, a falling one a challenge lost; a quick-time
; event plays its direction (notes climbing for up, falling for down, a note in the left or
; the right ear for the sides); blips of rising or falling pitch follow the button-mash ring
; and the breath bars.
Volume=80

[Subtitles]
; Read subtitle lines as they appear. The Subtitles hotkey switches this during play and
; saves the switch here, so a new start begins the way the last one ended.
Read=1

[Exploration]
; The beacon that leads to the chosen target along the walkable route: it sounds on the side
; of the next turn, rises in pitch as the target comes closer and drops an octave when the
; way is behind. The Beacon hotkey switches it during play and saves the switch here.
Beacon=1
; Milliseconds between two beacon sounds.
BeaconIntervalMs=500
; How far, in metres, the places of a scene are listed.
Range=100
; Target the nearest thing by itself when exploration begins.
AutoTarget=1
; Milliseconds between the word that the walk has begun and the character's first step,
; so the screen reader is heard before anything moves.
WalkDelayMs=500

[Combat]
; The aim sound during a fight: a blip in the ear on the side of the target, higher when the
; target is above the torch beam and lower when below, faster as the beam nears it, and a quick
; double ping while the beam is on the target. The Beacon hotkey switches it during a fight.
AimSound=1

[Features]
; 1 enables, 0 disables an area of the mod.
Menus=1
Pause=1
Hud=1
Subtitles=1
Prompts=1
Choices=1
Qte=1
ButtonMash=1
DontBreathe=1
Exploration=1
Credits=1
Combat=1
Tarot=1

[Diag]
TraceClassPrefixes=Menu,Pause,Choice,Prompt,Subtitle,QTE,Mash,Breathe,Popup,Notification,Reading
