; QuarryAccess — screen-reader accessibility mod for The Quarry.
; This file lives in <game>\SMG026\Binaries\Win64\Mods\QuarryAccess\QuarryAccess.ini
; Lines starting with ';' are comments. Values are read once at game start.

[General]
; Full | Normal | Minimal — how much is said when focus moves in menus.
Verbosity=Full
; auto = follow the game's text language; or a locale code such as ru_RU, en_US.
Language=auto
; Say a greeting with the detected screen reader and language at startup.
SpeakOnLoad=1
; Error | Info | Verbose | Trace
LogLevel=Info
; Also write Mods\QuarryAccess\QuarryAccess.log (in addition to UE4SS.log).
LogFile=1

[Hotkeys]
; Keyboard keys. Modifiers: Ctrl+, Alt+, Shift+ (e.g. Ctrl+F9). Empty disables a hotkey.
Repeat=F5
ReadScreen=F6
Stop=F7
Help=F8
DevDumpTree=Ctrl+F9
DevTrace=Ctrl+F10
DevLogLevel=Ctrl+F11
; Gamepad chord: hold PadChordHold and press one of the pad keys.
PadChordHold=Gamepad_Special_Left
PadRepeat=Gamepad_DPad_Up
PadReadScreen=Gamepad_DPad_Right
PadStop=Gamepad_DPad_Down
PadHelp=Gamepad_DPad_Left

[Speech]
FocusDedupeMs=150
ScreenArrivalGraceMs=400
CascadeDebounceMs=200
MaxQueuedSubtitles=2

[Features]
Menus=1
Settings=1
Popups=1
Subtitles=1
Choices=1
Prompts=1
QTE=1
Mash=1
DontBreathe=1
Combat=1
Exploration=1
StaticExploration=1
Notifications=1
ReadingPane=1
Tutorials=1

[Subtitles]
; 1 = a new subtitle interrupts the previous one; 0 = subtitles are queued.
Interrupt=0
SpeakClosedCaptions=1

[Mechanics]
; Seconds at which the remaining time of a timed choice is announced.
ChoiceCountdownAt=10,5,3,2,1
QTEBeep=0
DontBreatheDangerWarnMs=300
; 0 = only when the read-screen hotkey is pressed.
RadarIntervalMs=0
CombatTone=1

[Diag]
TraceClassPrefixes=Menu,Pause,Choice,Prompt,Subtitle,QTE,Mash,Breathe,Popup,Notification,Reading
