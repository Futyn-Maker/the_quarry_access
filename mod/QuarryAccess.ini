; QuarryAccess — screen-reader accessibility mod for The Quarry.
; This file lives in <game>\SMG026\Binaries\Win64\ue4ss\Mods\QuarryAccess\QuarryAccess.ini
; Lines starting with ';' are comments. Values are read once at game start.

[General]
; The verbosity level: Full | Brief — how much the mod says of its own, such as the place of an
; item in a list, which option a choice was settled on, or whether a mechanic was passed. What
; the game itself shows is read at either level. Switched on the fly with the Verbosity key
; below, and saved here.
Verbosity=Full
; auto = follow the game's text language; or a locale code such as ru_RU, en_US.
Language=auto
; Say a greeting with the detected screen reader and language at startup.
SpeakOnLoad=1
; Error | Info | Verbose | Trace
LogLevel=Info
; Also write Mods\QuarryAccess\QuarryAccess.log (in addition to UE4SS.log).
LogFile=1

[Hotkeys]
; Keyboard keys. Modifiers: Ctrl+, Alt+, Shift+ (e.g. Ctrl+F9). Empty disables a hotkey.
; Leave F10, F11 and F12 alone: F10 is the Windows menu-bar key and freezes the game until Escape,
; F11 switches the game between full screen and a window, F12 is the Steam screenshot key.
Repeat=F5
ReadScreen=F6
Stop=F7
Help=F8
Subtitles=F9
LastSubtitle=F4
; Speech through the screen reader or through SAPI, switched on the fly; the choice is saved
; under [Speech] PreferSapi.
Speech=F3
; The verbosity level of the mod's own messages, switched on the fly; saved under [General] Verbosity.
Verbosity=F2
; Exploration: the next and the previous thing to walk to, where the target is now, walking
; there by itself, the beacon on or off, and the places of the tarot cards in the list or not.
NextTarget=N
PreviousTarget=P
Where=H
Walk=G
Beacon=T
TarotCards=K
DevDumpTree=Ctrl+F9
DevTrace=Ctrl+F10
DevLogLevel=Ctrl+F11
; Gamepad chords: hold ChordHold and press one of the buttons below. While ChordHold is down
; the game sees no button, so a chord is never also a press for the game. Hold ChordHold with
; one thumb and press the second button with the other. On a DualSense or DualShock 4 the
; game calls the click of the touchpad Gamepad_Special_Left and Options Gamepad_Special_Right,
; and for the chords the button left of the touchpad counts as Gamepad_Special_Left as well.
ChordHold=Gamepad_Special_Left
ChordRepeat=Gamepad_FaceButton_Bottom
ChordReadScreen=Gamepad_FaceButton_Left
ChordStop=Gamepad_FaceButton_Right
ChordHelp=Gamepad_FaceButton_Top
ChordSubtitles=Gamepad_RightTrigger
ChordLastSubtitle=Gamepad_RightShoulder
ChordSpeech=Gamepad_RightThumbstick
ChordVerbosity=Gamepad_LeftThumbstick

; While the player walks the character freely the game leaves these buttons unused, so the
; exploration keys answer them there without the chord.
ExploreNext=Gamepad_DPad_Right
ExplorePrevious=Gamepad_DPad_Left
ExploreWhere=Gamepad_DPad_Up
ExploreWalk=Gamepad_FaceButton_Left
ExploreBeacon=Gamepad_DPad_Down
ExploreTarotCards=Gamepad_RightShoulder

[Speech]
; How long the same text is ignored when focus lands on it again.
FocusDedupeMs=150
; 1 makes SAPI speak even while a screen reader is running; 0 leaves the speech to the screen
; reader. Without a screen reader SAPI speaks either way. The Speech hotkey switches this
; during play and saves the switch here.
PreferSapi=0

[Sounds]
; Volume of the cues the mod plays itself, 0 to 100; 0 turns them off. A rising two-note tone
; marks a choice committing or a challenge won, a falling one a challenge lost; three quick
; taps mark an interruption; a quick-time event plays its direction (notes climbing for up,
; falling for down, a note in the left or the right ear for the sides), and the falling notes
; also mark the moment to hold your breath; blips of rising or falling pitch follow the
; button-mash ring and the breath bars; a soft tone sliding up marks the game giving you
; control of the character, and one sliding down its taking control away.
Volume=80

[Subtitles]
; Read subtitle lines as they appear. The Subtitles hotkey switches this during play and
; saves the switch here, so a new start begins the way the last one ended.
Read=1

[Exploration]
; The beacon that leads to the chosen target along the walkable route: it sounds on the side
; of the next turn, rises in pitch as the target comes closer and drops an octave when the
; way is behind. The Beacon hotkey switches it during play and saves the switch here.
Beacon=1
; Milliseconds between two beacon sounds.
BeaconIntervalMs=500
; How far, in metres, the places of a scene are listed.
Range=100
; Target the nearest thing by itself when exploration begins.
AutoTarget=1
; Milliseconds between the word that the walk has begun and the character's first step,
; so the screen reader is heard before anything moves.
WalkDelayMs=500
; The places of the scene's tarot cards in the list of things to walk to, each as one more
; "Way on". The game shows a card only once you pass the spot where it lies, so this is a
; hint the screen does not give; it is off unless you ask for it. A card that lies on the
; way to something already listed is left out, since walking there shows it anyway. The
; TarotCards hotkey switches it during play and saves the switch here.
TarotCards=0

[Combat]
; The aim sound during a fight: a blip in the ear on the side of the target, higher when the
; target is above the torch beam and lower when below, faster as the beam nears it, and a quick
; double ping while the beam is on the target. The Beacon hotkey switches it during a fight.
AimSound=1

[Features]
; 1 enables, 0 disables an area of the mod.
Menus=1
Pause=1
Hud=1
Subtitles=1
Prompts=1
Choices=1
Qte=1
ButtonMash=1
DontBreathe=1
Exploration=1
Credits=1
Combat=1
Tarot=1
Screens=1

[Diag]
TraceClassPrefixes=Menu,Pause,Choice,Prompt,Subtitle,QTE,Mash,Breathe,Popup,Notification,Reading
