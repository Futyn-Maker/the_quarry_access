help.combat=Ziele mit der Maus oder dem rechten Stick; das Spiel zeigt dein Ziel als Lichtkegel der Taschenlampe an der Waffe. Die Töne erklingen im Ohr auf der Seite des Ziels, höher, wenn es über dem Lichtkegel liegt, tiefer, wenn darunter, und schneller, je näher der Lichtkegel ihm kommt; ein schneller Doppelton bedeutet, dass der Lichtkegel auf dem Ziel liegt und der Schuss treffen würde. {0} feuert. {1} und {2} wechseln zwischen den Zielen, {3} schaltet den Zielton aus und ein.
