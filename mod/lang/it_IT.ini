help.combat=Mira con il mouse o con la levetta destra; il gioco mostra la mira come il fascio della torcia sull'arma. I segnali suonano nell'orecchio dal lato del bersaglio, più acuti quando è sopra il fascio e più gravi quando è sotto, e accelerano man mano che il fascio gli si avvicina; un doppio segnale rapido significa che il fascio è sul bersaglio e il colpo andrebbe a segno. {0} spara. {1} e {2} cambiano bersaglio, {3} spegne e accende il suono di mira.
