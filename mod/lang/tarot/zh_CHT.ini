; QuarryAccess tarot vision descriptions — Chinese (traditional). One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=雅各蹲在小型貨車前方，拔下油管。之後引擎起火，貨車燒了起來。
tarot.temperance=在營區商店裡，艾瑪打開保險箱，取出煙火。之後一隻怪物把她壓倒在地；她把煙火對著牠的臉點燃，怪物被炸得從她身上彈開。
tarot.thehangedman=雅各踩中套索，被倒吊在樹上。一名獵人走來把他放下。雅各把泥土甩進獵人的眼睛，掙脫逃走。
tarot.thestar=在樹屋裡，艾瑪用電擊槍擊中一隻怪物，再用手機相機的閃光燈讓牠睜不開眼。
tarot.tower=艾瑪逃離怪物，跑上塔頂。她跳向滑索，沒有抓住，墜落身亡。
tarot.strength=被咬傷後病倒的尼克突然力氣大增，掐住獵人的喉嚨，把他按在門上，然後甩到一旁。
tarot.magician=在廣播棚裡，萊恩用電鋸鋸掉了狄倫被咬傷的手臂。
tarot.devil=感染吞噬了尼克。他變成了那種怪物，扯下了艾比蓋兒的頭。
tarot.hermitfuture=雅各的腿被捕熊夾夾住。他硬拽出來後摔倒，頭落進第二個夾子，當場喪命。
tarot.hermitpast=在船庫旁，獵人巴比和一個年長的獵人把一具屍體丟進湖裡。巴比撿起一個健行者的背包。
tarot.justice=在警察局裡，蘿拉和警察爭奪他的手槍，一槍打中他的腹部。
tarot.moon=蘿拉把藏起來的注射器扎進警察的脖子。
tarot.chariot=凱特琳和狄倫走近小型貨車。凱特琳端著霰彈槍掩護，狄倫拉開車門。
tarot.world=萊恩和蘿拉在戶外爭吵。萊恩轉身離開，腳下的地面塌陷，他掉進了洞裡。
tarot.empress=哈克特宅邸的老婦人摀住胸口。一隻狼人將她撕碎殺死。
tarot.lovers=萊恩受傷躺著。蘿拉跪在他身旁，咬住他的手臂。
tarot.wheeloffortune=蘿拉變成狼人。一隻狼人撕碎了巴比。萊恩用霰彈槍瞄準蘿拉卻沒有開槍，狼人殺死了他。崔維斯和蘿拉同歸於盡。
tarot.emperor=一隻狼人襲擊年長的獵人，將他殺死。
tarot.kaitlynsdeath=凱特琳走在營區主屋高處的橫梁上。她失足墜落，當場身亡。
tarot.laurasdeath=蘿拉從撞毀的汽車旁爬開。一隻狼人撲上來殺死了她。
tarot.sunabigail=日出。艾比蓋兒在滿是監視螢幕的房間裡，活著迎來新的一天。
tarot.sundylan=日出。狄倫在營區主屋裡，活著迎來新的一天。
tarot.sunemmaoffice=日出。艾瑪在滿是監視螢幕的房間裡，活著迎來新的一天。
tarot.sunemmawoods=日出。艾瑪站在林中，衣衫破碎、沾滿血跡，活著迎來新的一天。
tarot.sunjacob=日出。雅各在林中，新一天的晨光灑在他臉上。
tarot.sunkaitlyn=日出。凱特琳在營區主屋裡，活著迎來新的一天。
tarot.sunlaura=日出。蘿拉在畸形秀的場地上，活著迎來新的一天。
tarot.sunlauraisland=日出。蘿拉和麥斯一起在小島上，活著迎來新的一天。
tarot.sunmax=日出。麥斯在小島上，活著迎來新的一天。
tarot.sunryan=日出。萊恩在林中，活著迎來新的一天。
tarot.judgement=蘿拉、萊恩和崔維斯站在一隻受傷的狼人前。崔維斯走向蘿拉，伸手去拿霰彈槍。蘿拉朝他開槍，他倒下了。
tarot.judgement1=在營區主屋的廚房裡，凱特琳用玩具引來一隻狼人，把牠關進冷凍庫。
tarot.judgement2=雅各在林中奔跑，一隻狼人在後面追。狼人踩中了陷阱。
tarot.judgement3=麥斯走下小島的碼頭，留在了那裡。
