; QuarryAccess tarot vision descriptions — Norwegian. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob sit på huk framfor minibussen og riv laus drivstoffslangen. Seinare tek motoren fyr, og minibussen brenn.
tarot.temperance=I leirbutikken opnar Emma ein safe og tek ut fyrverkeri. Seinare pressar ein skapning henne ned mot bakken; ho fyrer av eit fyrverkeri i andletet på han, og han blir slengd av henne.
tarot.thehangedman=Jacob trør i ei snare og blir heisa opp-ned i eit tre. Ein jeger kjem og skjer han ned. Jacob kastar jord i auga på han og riv seg laus.
tarot.thestar=I trehytta lammar Emma ein skapning med elektrosjokkaren og blindar han med blitsen på telefonkameraet sitt.
tarot.tower=Emma flyktar frå ein skapning opp i tårnet. Ho hoppar etter zipline-vaieren, bommar og fell i døden.
tarot.strength=Nick, sjuk av bitet sitt, grip jegeren om strupen med brå kraft, pressar han mot ei dør og slengjer han til sides.
tarot.magician=I radiohytta sagar Ryan av den bitne armen til Dylan med ei motorsag.
tarot.devil=Infeksjonen tek over Nick. Han blir til ein av skapningane og riv hovudet av Abigail.
tarot.hermitfuture=Beinet til Jacob sit fast i ei bjørnefelle. Han riv seg laus, fell, og hovudet hans hamnar i ei andre felle, som drep han.
tarot.hermitpast=Ved naustet slepper jegeren Bobby og ein eldre jeger eit lik i vatnet. Bobby plukkar opp ryggsekken til ein turgåar.
tarot.justice=På politistasjonen slåst Laura med politimannen om pistolen hans og skyt han i magen.
tarot.moon=Laura stikk ei gøymd sprøyte i halsen på politimannen.
tarot.chariot=Kaitlyn og Dylan går bort til minibussen. Dylan opnar døra medan Kaitlyn dekkjer han med haglgeværet.
tarot.world=Ryan og Laura kranglar under open himmel. Ryan snur seg bort, bakken gjev etter under han, og han fell ned i eit hol.
tarot.empress=Den gamle kvinna frå huset til familien Hackett grip seg til brystet. Ein varulv riv henne sund og drep henne.
tarot.lovers=Ryan ligg såra. Laura kneler ved sida av han og bit han i armen.
tarot.wheeloffortune=Laura blir til ein varulv. Ein varulv riv Bobby sund. Ryan siktar på Laura med eit haglgevær, men skyt ikkje, og varulven drep han. Travis og Laura drep kvarandre.
tarot.emperor=Ein varulv går til åtak på den gamle jegeren og drep han.
tarot.kaitlynsdeath=Kaitlyn går på ein bjelke høgt oppe i hovudhuset. Ho mistar fotfestet og fell i døden.
tarot.laurasdeath=Laura kryp bort frå ein krasja bil. Ein varulv går til åtak på henne og drep henne.
tarot.sunabigail=Soloppgang. Abigail er i rommet fullt av skjermar, i live når den nye dagen tek til.
tarot.sundylan=Soloppgang. Dylan er i hovudhuset, i live når den nye dagen tek til.
tarot.sunemmaoffice=Soloppgang. Emma er i rommet fullt av skjermar, i live når den nye dagen tek til.
tarot.sunemmawoods=Soloppgang. Emma står i skogen med sundrivne, blodige klede, i live når den nye dagen tek til.
tarot.sunjacob=Soloppgang. Jacob er i skogen med lyset frå den nye dagen i andletet.
tarot.sunkaitlyn=Soloppgang. Kaitlyn er i hovudhuset, i live når den nye dagen tek til.
tarot.sunlaura=Soloppgang. Laura er på området til freakshowet, i live når den nye dagen tek til.
tarot.sunlauraisland=Soloppgang. Laura og Max er saman på øya, i live når den nye dagen tek til.
tarot.sunmax=Soloppgang. Max er på øya, i live når den nye dagen tek til.
tarot.sunryan=Soloppgang. Ryan er i skogen, i live når den nye dagen tek til.
tarot.judgement=Laura, Ryan og Travis står over ein såra varulv. Travis går mot Laura og strekkjer seg etter haglgeværet. Laura skyt han, og han fell.
tarot.judgement1=På kjøkenet i hovudhuset lokkar Kaitlyn ein varulv med ei leike og stengjer han inne i kjølerommet.
tarot.judgement2=Jacob spring gjennom skogen med ein varulv etter seg. Varulven går i ei felle.
tarot.judgement3=Max går ned til brygga på øya og blir der.
