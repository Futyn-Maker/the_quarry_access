; QuarryAccess tarot vision descriptions — English (master table). One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob crouches at the front of the minivan and pulls the fuel line loose. Later the engine catches fire and the minivan burns.
tarot.temperance=In the camp store, Emma opens a safe and takes out fireworks. Later a werewolf pins her to the ground; she sets a firework off in its face and it is thrown off her.
tarot.thehangedman=Jacob steps into a snare and is hoisted upside down from a tree. A hunter comes and cuts him down. Jacob throws dirt in the hunter's eyes and breaks free.
tarot.thestar=In the treehouse, Emma tasers a werewolf and blinds it with the flash of her phone's camera.
tarot.tower=Emma flees a werewolf up the tower. She jumps for the zipline, misses, and falls to her death.
tarot.strength=Nick, his strength swollen by the infection, grabs the hunter Bobby by the throat, pins him against a door and throws him aside.
tarot.magician=In the radio hut, Ryan cuts off Dylan's bitten arm with a chainsaw.
tarot.devil=Nick's infection takes him over. He turns into a werewolf and tears Abigail's head off.
tarot.hermitfuture=Jacob's leg is caught in a bear trap. He tears free and falls, and his head lands in a second trap, which kills him.
tarot.hermitpast=At the boathouse, Jedediah and Bobby Hackett drop a body into the lake. Bobby picks up a hiker's backpack.
tarot.justice=In the police station, Laura struggles with Travis for his gun and shoots him in the stomach.
tarot.moon=Laura jabs a hidden syringe of tranquilizer into Travis's neck.
tarot.chariot=Kaitlyn and Dylan approach the minivan. Dylan opens its door while Kaitlyn covers him with the shotgun.
tarot.world=Ryan and Laura argue in the open. Ryan turns away, the ground gives way under him, and he falls through into a hole below.
tarot.empress=Constance Hackett clutches her chest. A werewolf mauls her and kills her.
tarot.lovers=Ryan lies wounded. Laura kneels beside him and bites his arm.
tarot.wheeloffortune=Laura turns into a werewolf. A werewolf mauls Bobby. Ryan aims a shotgun at Laura but does not fire, and the werewolf kills him. Travis and Laura kill each other.
tarot.emperor=A werewolf attacks Jedediah Hackett and kills him.
tarot.kaitlynsdeath=Kaitlyn walks along a beam high up in the lodge. She loses her footing and falls to her death.
tarot.laurasdeath=Laura crawls away from a crashed car. A werewolf attacks her and kills her.
tarot.sunabigail=Sunrise. Abigail is in the room full of monitors, alive as the new day begins.
tarot.sundylan=Sunrise. Dylan is in the lodge, alive as the new day begins.
tarot.sunemmaoffice=Sunrise. Emma is in the room full of monitors, alive as the new day begins.
tarot.sunemmawoods=Sunrise. Emma stands in the woods, her clothes torn and bloodied, alive as the new day begins.
tarot.sunjacob=Sunrise. Jacob is in the woods, the light of the new day on his face.
tarot.sunkaitlyn=Sunrise. Kaitlyn is in the lodge, alive as the new day begins.
tarot.sunlaura=Sunrise. Laura is on the grounds of the freak show, alive as the new day begins.
tarot.sunlauraisland=Sunrise. Laura and Max are together on the island, alive as the new day begins.
tarot.sunmax=Sunrise. Max is on the island, alive as the new day begins.
tarot.sunryan=Sunrise. Ryan is in the woods, alive as the new day begins.
tarot.judgement=Laura, Ryan and Travis stand over a wounded werewolf. Travis steps toward Laura and reaches for the shotgun. Laura shoots him and he falls.
tarot.judgement1=In the lodge kitchen, Kaitlyn lures a werewolf with a toy and shuts it inside the walk-in freezer.
tarot.judgement2=Jacob runs through the forest with a werewolf after him. The werewolf is caught in a trap.
tarot.judgement3=Max walks down to the dock of the island and stays there.
