; QuarryAccess tarot vision descriptions — Chinese (simplified). One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=杰克布蹲在小型货车前部，拔下了油管。之后发动机起火，货车被烧毁。
tarot.temperance=在营地小卖部，艾玛打开保险箱，取出烟花。之后一只怪物把她按倒在地；她把烟花对着它的脸点燃，怪物被炸得从她身上弹开。
tarot.thehangedman=杰克布踩中套索，被倒吊在树上。一名猎人走来把他放下。杰克布把泥土甩进猎人的眼睛，挣脱逃走。
tarot.thestar=在树屋里，艾玛用电击枪击中一只怪物，再用手机相机的闪光灯让它睁不开眼。
tarot.tower=艾玛逃离怪物，跑上塔顶。她跳向滑索，没有抓住，坠落身亡。
tarot.strength=被咬伤后病倒的尼克突然力量大增，掐住猎人的喉咙，把他按在门上，然后甩到一旁。
tarot.magician=在广播棚里，莱恩用电锯锯掉了迪伦被咬伤的手臂。
tarot.devil=感染吞噬了尼克。他变成了那种怪物，扯下了艾比盖尔的头。
tarot.hermitfuture=杰克布的腿被捕熊夹夹住。他硬拽出来后摔倒，头落进第二个夹子，当场丧命。
tarot.hermitpast=在船库旁，猎人波比和一个年长的猎人把一具尸体扔进湖里。波比捡起一个徒步者的背包。
tarot.justice=在警察局里，劳拉和警察争夺他的手枪，一枪打中他的腹部。
tarot.moon=劳拉把藏起来的注射器扎进警察的脖子。
tarot.chariot=凯特琳和迪伦走近小型货车。凯特琳端着霰弹枪掩护，迪伦拉开车门。
tarot.world=莱恩和劳拉在户外争吵。莱恩转身离开，脚下的地面塌陷，他掉进了洞里。
tarot.empress=哈克特宅邸的老妇人捂住胸口。一只狼人将她撕碎杀死。
tarot.lovers=莱恩受伤躺着。劳拉跪在他身旁，咬住他的手臂。
tarot.wheeloffortune=劳拉变成狼人。一只狼人撕碎了波比。莱恩用霰弹枪瞄准劳拉却没有开枪，狼人杀死了他。崔维斯和劳拉同归于尽。
tarot.emperor=一只狼人袭击年长的猎人，将他杀死。
tarot.kaitlynsdeath=凯特琳走在营地主屋高处的横梁上。她失足坠落，当场身亡。
tarot.laurasdeath=劳拉从撞毁的汽车旁爬开。一只狼人扑上来杀死了她。
tarot.sunabigail=日出。艾比盖尔在满是监视屏的房间里，活着迎来新的一天。
tarot.sundylan=日出。迪伦在营地主屋里，活着迎来新的一天。
tarot.sunemmaoffice=日出。艾玛在满是监视屏的房间里，活着迎来新的一天。
tarot.sunemmawoods=日出。艾玛站在林中，衣衫破碎、沾满血迹，活着迎来新的一天。
tarot.sunjacob=日出。杰克布在林中，新一天的晨光洒在他脸上。
tarot.sunkaitlyn=日出。凯特琳在营地主屋里，活着迎来新的一天。
tarot.sunlaura=日出。劳拉在畸形秀的场地上，活着迎来新的一天。
tarot.sunlauraisland=日出。劳拉和麦克斯一起在小岛上，活着迎来新的一天。
tarot.sunmax=日出。麦克斯在小岛上，活着迎来新的一天。
tarot.sunryan=日出。莱恩在林中，活着迎来新的一天。
tarot.judgement=劳拉、莱恩和崔维斯站在一只受伤的狼人前。崔维斯走向劳拉，伸手去拿霰弹枪。劳拉朝他开枪，他倒下了。
tarot.judgement1=在营地主屋的厨房里，凯特琳用玩具引来一只狼人，把它关进冷库。
tarot.judgement2=杰克布在林中奔跑，一只狼人在后面追。狼人踩中了陷阱。
tarot.judgement3=麦克斯走下小岛的码头，留在了那里。
