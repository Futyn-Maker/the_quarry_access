; QuarryAccess tarot vision descriptions — Russian. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Джейкоб присел у передней части минивэна и отсоединяет топливный шланг. Позже двигатель загорается, и минивэн горит.
tarot.temperance=В магазине лагеря Эмма открывает сейф и достаёт фейерверки. Позже существо прижимает её к земле; она поджигает фейерверк ему в морду, и его отбрасывает.
tarot.thehangedman=Джейкоб попадает ногой в силок, и его вздёргивает вниз головой на дереве. Подходит охотник и срезает его. Джейкоб швыряет охотнику в глаза землю и вырывается.
tarot.thestar=В домике на дереве Эмма бьёт существо электрошокером и ослепляет его вспышкой камеры телефона.
tarot.tower=Эмма убегает от существа наверх вышки. Она прыгает к тросу зиплайна, промахивается и разбивается насмерть.
tarot.strength=Больной от укуса Ник с внезапной силой хватает охотника за горло, прижимает его к двери и отшвыривает.
tarot.magician=В радиорубке Райан отпиливает бензопилой укушенную руку Дилана.
tarot.devil=Заражение берёт над Ником верх. Он превращается в одно из этих существ и отрывает Эбигейл голову.
tarot.hermitfuture=Нога Джейкоба зажата в медвежьем капкане. Он вырывается, падает, и его голова попадает во второй капкан, который его убивает.
tarot.hermitpast=У лодочного сарая охотник Бобби и пожилой охотник сбрасывают тело в озеро. Бобби поднимает рюкзак туриста.
tarot.justice=В полицейском участке Лора борется с полицейским за его пистолет и стреляет ему в живот.
tarot.moon=Лора вонзает полицейскому в шею спрятанный шприц.
tarot.chariot=Кейтлин и Дилан подходят к минивэну. Дилан открывает его дверь, а Кейтлин прикрывает его с дробовиком.
tarot.world=Райан и Лора спорят под открытым небом. Райан отворачивается, земля под ним проваливается, и он падает в яму.
tarot.empress=Пожилая женщина хватается за грудь. Оборотень терзает её и убивает.
tarot.lovers=Райан лежит раненый. Лора опускается рядом на колени и кусает его за руку.
tarot.wheeloffortune=Лора превращается в оборотня. Оборотень терзает Бобби. Райан целится в Лору из дробовика, но не стреляет, и оборотень убивает его. Трэвис и Лора убивают друг друга.
tarot.emperor=Оборотень нападает на пожилого охотника и убивает его.
tarot.kaitlynsdeath=Кейтлин идёт по балке высоко под крышей главного дома. Она оступается и разбивается насмерть.
tarot.laurasdeath=Лора отползает от разбитой машины. Оборотень нападает на неё и убивает.
tarot.sunabigail=Рассвет. Эбигейл в комнате, полной мониторов, жива с наступлением нового дня.
tarot.sundylan=Рассвет. Дилан в главном доме, жив с наступлением нового дня.
tarot.sunemmaoffice=Рассвет. Эмма в комнате, полной мониторов, жива с наступлением нового дня.
tarot.sunemmawoods=Рассвет. Эмма стоит в лесу в разорванной, окровавленной одежде, жива с наступлением нового дня.
tarot.sunjacob=Рассвет. Джейкоб в лесу, свет нового дня падает на его лицо.
tarot.sunkaitlyn=Рассвет. Кейтлин в главном доме, жива с наступлением нового дня.
tarot.sunlaura=Рассвет. Лора на площадке бродячего цирка, жива с наступлением нового дня.
tarot.sunlauraisland=Рассвет. Лора и Макс вместе на острове, живы с наступлением нового дня.
tarot.sunmax=Рассвет. Макс на острове, жив с наступлением нового дня.
tarot.sunryan=Рассвет. Райан в лесу, жив с наступлением нового дня.
tarot.judgement=Лора, Райан и Трэвис стоят над раненым оборотнем. Трэвис шагает к Лоре и тянется к дробовику. Лора стреляет в него, и он падает.
tarot.judgement1=На кухне главного дома Кейтлин приманивает оборотня игрушкой и запирает его в морозильной камере.
tarot.judgement2=Джейкоб бежит через лес, оборотень гонится за ним. Оборотень попадает в капкан.
tarot.judgement3=Макс спускается к причалу на острове и остаётся там.
