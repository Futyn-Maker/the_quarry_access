; QuarryAccess tarot vision descriptions — Portuguese (Portugal). One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob, agachado à frente da carrinha, solta o tubo do combustível. Mais tarde o motor pega fogo e a carrinha arde.
tarot.temperance=Na loja do acampamento, Emma abre um cofre e tira fogo de artifício. Mais tarde uma criatura prende-a no chão; Emma dispara um foguete na cara da criatura, que é projetada para longe.
tarot.thehangedman=Jacob pisa um laço e fica pendurado de cabeça para baixo numa árvore. Chega um caçador e corta-o da corda. Jacob atira-lhe terra aos olhos e liberta-se.
tarot.thestar=Na casa da árvore, Emma atinge uma criatura com o taser e cega-a com o flash da câmara do telemóvel.
tarot.tower=Emma foge de uma criatura até ao cimo da torre. Salta para o slide, falha e cai para a morte.
tarot.strength=Nick, doente por causa da mordedura, agarra o caçador pela garganta com uma força repentina, encosta-o a uma porta e atira-o para o lado.
tarot.magician=Na cabina de rádio, Ryan corta com uma motosserra o braço mordido de Dylan.
tarot.devil=A infeção toma conta de Nick. Ele transforma-se numa daquelas criaturas e arranca a cabeça a Abigail.
tarot.hermitfuture=A perna de Jacob fica presa numa armadilha para ursos. Ele solta-se à força, cai, e a cabeça vai parar a uma segunda armadilha, que o mata.
tarot.hermitpast=No estaleiro, o caçador Bobby e um caçador mais velho deitam um corpo ao lago. Bobby apanha a mochila de um caminhante.
tarot.justice=Na esquadra, Laura luta com o polícia pela pistola dele e dispara-lhe na barriga.
tarot.moon=Laura espeta no pescoço do polícia uma seringa que tinha escondida.
tarot.chariot=Kaitlyn e Dylan aproximam-se da carrinha. Dylan abre a porta enquanto Kaitlyn o cobre com a caçadeira.
tarot.world=Ryan e Laura discutem ao ar livre. Ryan vira-se, o chão cede sob ele e cai num buraco.
tarot.empress=Uma mulher idosa leva a mão ao peito. Um lobisomem dilacera-a e mata-a.
tarot.lovers=Ryan está deitado, ferido. Laura ajoelha-se ao lado dele e morde-lhe o braço.
tarot.wheeloffortune=Laura transforma-se em lobisomem. Um lobisomem dilacera Bobby. Ryan aponta uma caçadeira a Laura mas não dispara, e o lobisomem mata-o. Travis e Laura matam-se um ao outro.
tarot.emperor=Um lobisomem ataca o velho caçador e mata-o.
tarot.kaitlynsdeath=Kaitlyn caminha sobre uma viga no alto do refúgio. Perde o equilíbrio e cai para a morte.
tarot.laurasdeath=Laura rasteja para longe de um carro acidentado. Um lobisomem ataca-a e mata-a.
tarot.sunabigail=Nascer do sol. Abigail está na sala cheia de monitores, viva no início do novo dia.
tarot.sundylan=Nascer do sol. Dylan está no refúgio, vivo no início do novo dia.
tarot.sunemmaoffice=Nascer do sol. Emma está na sala cheia de monitores, viva no início do novo dia.
tarot.sunemmawoods=Nascer do sol. Emma está de pé no bosque, com a roupa rasgada e ensanguentada, viva no início do novo dia.
tarot.sunjacob=Nascer do sol. Jacob está no bosque, com a luz do novo dia no rosto.
tarot.sunkaitlyn=Nascer do sol. Kaitlyn está no refúgio, viva no início do novo dia.
tarot.sunlaura=Nascer do sol. Laura está no recinto do espetáculo de aberrações, viva no início do novo dia.
tarot.sunlauraisland=Nascer do sol. Laura e Max estão juntos na ilha, vivos no início do novo dia.
tarot.sunmax=Nascer do sol. Max está na ilha, vivo no início do novo dia.
tarot.sunryan=Nascer do sol. Ryan está no bosque, vivo no início do novo dia.
tarot.judgement=Laura, Ryan e Travis estão de pé sobre um lobisomem ferido. Travis avança para Laura e estende a mão para a caçadeira. Laura dispara sobre ele e ele cai.
tarot.judgement1=Na cozinha do refúgio, Kaitlyn atrai um lobisomem com um brinquedo e fecha-o na câmara frigorífica.
tarot.judgement2=Jacob corre pela floresta com um lobisomem atrás dele. O lobisomem cai numa armadilha.
tarot.judgement3=Max desce até ao pontão da ilha e fica lá.
