; QuarryAccess tarot vision descriptions — Korean. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=제이콥이 미니밴 앞에 웅크리고 앉아 연료 호스를 뜯어낸다. 나중에 엔진에 불이 붙고 미니밴이 불탄다.
tarot.temperance=캠프 매점에서 엠마가 금고를 열고 폭죽을 꺼낸다. 나중에 괴물이 엠마를 땅에 짓누르자, 엠마가 폭죽을 그 얼굴에 대고 터뜨리고 괴물은 튕겨 나간다.
tarot.thehangedman=제이콥이 올가미를 밟고 나무에 거꾸로 매달린다. 사냥꾼이 와서 줄을 끊어 준다. 제이콥은 사냥꾼의 눈에 흙을 뿌리고 달아난다.
tarot.thestar=나무집에서 엠마가 괴물을 전기충격기로 쓰러뜨리고 휴대전화 카메라 플래시로 눈을 멀게 한다.
tarot.tower=엠마가 괴물을 피해 탑 위로 달아난다. 짚라인을 향해 뛰어오르지만 잡지 못하고 떨어져 죽는다.
tarot.strength=물린 상처로 앓던 닉이 갑작스러운 힘으로 사냥꾼의 목을 움켜쥐고 문에 밀어붙인 뒤 옆으로 내던진다.
tarot.magician=라디오 오두막에서 라이언이 전기톱으로 딜런의 물린 팔을 잘라 낸다.
tarot.devil=감염이 닉을 집어삼킨다. 닉은 그 괴물들 중 하나로 변해 애비게일의 머리를 뜯어낸다.
tarot.hermitfuture=제이콥의 다리가 곰덫에 물린다. 억지로 빠져나오다 쓰러지고, 머리가 두 번째 덫에 걸려 목숨을 잃는다.
tarot.hermitpast=보트 창고에서 사냥꾼 바비와 나이 든 사냥꾼이 시체를 호수에 떨어뜨린다. 바비가 등산객의 배낭을 집어 든다.
tarot.justice=경찰서에서 로라가 경찰과 권총을 놓고 몸싸움을 벌이다 그의 배에 총을 쏜다.
tarot.moon=로라가 숨겨 두었던 주사기를 경찰의 목에 찔러 넣는다.
tarot.chariot=케이틀린과 딜런이 미니밴에 다가간다. 케이틀린이 산탄총으로 엄호하는 동안 딜런이 문을 연다.
tarot.world=라이언과 로라가 바깥에서 말다툼을 한다. 라이언이 돌아서자 발밑의 땅이 꺼지고, 그는 구멍 아래로 떨어진다.
tarot.empress=나이 든 여자가 가슴을 움켜쥔다. 늑대인간이 그녀를 찢어발겨 죽인다.
tarot.lovers=라이언이 다친 채 누워 있다. 로라가 곁에 무릎을 꿇고 그의 팔을 문다.
tarot.wheeloffortune=로라가 늑대인간으로 변한다. 늑대인간이 바비를 찢어발긴다. 라이언이 로라에게 산탄총을 겨누지만 쏘지 않고, 늑대인간이 그를 죽인다. 트래비스와 로라가 서로를 죽인다.
tarot.emperor=늑대인간이 나이 든 사냥꾼을 덮쳐 죽인다.
tarot.kaitlynsdeath=케이틀린이 산장 높은 곳의 들보 위를 걷는다. 발을 헛디뎌 떨어져 죽는다.
tarot.laurasdeath=로라가 부서진 차에서 기어 나와 멀어진다. 늑대인간이 덮쳐 그녀를 죽인다.
tarot.sunabigail=해돋이. 애비게일은 모니터로 가득한 방에서 새날의 시작을 살아서 맞는다.
tarot.sundylan=해돋이. 딜런은 산장에서 새날의 시작을 살아서 맞는다.
tarot.sunemmaoffice=해돋이. 엠마는 모니터로 가득한 방에서 새날의 시작을 살아서 맞는다.
tarot.sunemmawoods=해돋이. 엠마는 찢어지고 피에 젖은 옷차림으로 숲에 서서 새날의 시작을 살아서 맞는다.
tarot.sunjacob=해돋이. 제이콥은 숲에 있고, 새날의 빛이 그의 얼굴에 비친다.
tarot.sunkaitlyn=해돋이. 케이틀린은 산장에서 새날의 시작을 살아서 맞는다.
tarot.sunlaura=해돋이. 로라는 괴물 쇼 터에서 새날의 시작을 살아서 맞는다.
tarot.sunlauraisland=해돋이. 로라와 맥스는 섬에서 함께 새날의 시작을 살아서 맞는다.
tarot.sunmax=해돋이. 맥스는 섬에서 새날의 시작을 살아서 맞는다.
tarot.sunryan=해돋이. 라이언은 숲에서 새날의 시작을 살아서 맞는다.
tarot.judgement=로라, 라이언, 트래비스가 다친 늑대인간을 내려다보며 서 있다. 트래비스가 로라에게 다가가 산탄총으로 손을 뻗는다. 로라가 그를 쏘고, 트래비스는 쓰러진다.
tarot.judgement1=산장 주방에서 케이틀린이 장난감으로 늑대인간을 꾀어 냉동 창고에 가둔다.
tarot.judgement2=제이콥이 숲을 달리고 늑대인간이 뒤쫓는다. 늑대인간이 덫에 걸린다.
tarot.judgement3=맥스가 섬의 선착장으로 내려가 그곳에 남는다.
