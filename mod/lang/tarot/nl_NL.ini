; QuarryAccess tarot vision descriptions — Dutch. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob zit gehurkt bij de voorkant van het busje en trekt de brandstofleiding los. Later vat de motor vlam en brandt het busje uit.
tarot.temperance=In de kampwinkel opent Emma een kluis en haalt er vuurwerk uit. Later drukt een wezen haar tegen de grond; ze laat een stuk vuurwerk in zijn gezicht afgaan en het wordt van haar af geslingerd.
tarot.thehangedman=Jacob stapt in een strik en wordt ondersteboven aan een boom omhooggetrokken. Een jager komt en snijdt hem los. Jacob gooit aarde in zijn ogen en ontsnapt.
tarot.thestar=In de boomhut schakelt Emma een wezen uit met de taser en verblindt het met de flitser van de camera van haar telefoon.
tarot.tower=Emma vlucht voor een wezen de toren op. Ze springt naar de tokkelbaan, mist en valt te pletter.
tarot.strength=Nick, ziek van zijn beet, grijpt de jager met plotselinge kracht bij de keel, drukt hem tegen een deur en slingert hem opzij.
tarot.magician=In de radiohut zaagt Ryan met een kettingzaag Dylans gebeten arm af.
tarot.devil=De infectie krijgt Nick in haar greep. Hij verandert in een van die wezens en rukt Abigails hoofd eraf.
tarot.hermitfuture=Jacobs been zit vast in een berenklem. Hij rukt zich los, valt, en zijn hoofd belandt in een tweede klem, die hem doodt.
tarot.hermitpast=Bij het boothuis laten de jager Bobby en een oudere jager een lichaam in het meer vallen. Bobby raapt de rugzak van een wandelaar op.
tarot.justice=Op het politiebureau worstelt Laura met de agent om zijn pistool en schiet hem in zijn buik.
tarot.moon=Laura steekt een verborgen spuit in de nek van de agent.
tarot.chariot=Kaitlyn en Dylan lopen naar het busje. Dylan opent de deur terwijl Kaitlyn hem dekt met het jachtgeweer.
tarot.world=Ryan en Laura maken ruzie in de openlucht. Ryan draait zich om, de grond zakt onder hem weg en hij valt in een gat.
tarot.empress=Een oude vrouw grijpt naar haar borst. Een weerwolf verscheurt haar en doodt haar.
tarot.lovers=Ryan ligt gewond. Laura knielt naast hem en bijt in zijn arm.
tarot.wheeloffortune=Laura verandert in een weerwolf. Een weerwolf verscheurt Bobby. Ryan richt een jachtgeweer op Laura maar schiet niet, en de weerwolf doodt hem. Travis en Laura doden elkaar.
tarot.emperor=Een weerwolf valt de oude jager aan en doodt hem.
tarot.kaitlynsdeath=Kaitlyn loopt over een balk hoog in de lodge. Ze verliest haar evenwicht en valt te pletter.
tarot.laurasdeath=Laura kruipt weg van een verongelukte auto. Een weerwolf valt haar aan en doodt haar.
tarot.sunabigail=Zonsopgang. Abigail is in de kamer vol beeldschermen, levend bij het begin van de nieuwe dag.
tarot.sundylan=Zonsopgang. Dylan is in de lodge, levend bij het begin van de nieuwe dag.
tarot.sunemmaoffice=Zonsopgang. Emma is in de kamer vol beeldschermen, levend bij het begin van de nieuwe dag.
tarot.sunemmawoods=Zonsopgang. Emma staat in het bos, haar kleren gescheurd en bebloed, levend bij het begin van de nieuwe dag.
tarot.sunjacob=Zonsopgang. Jacob is in het bos, het licht van de nieuwe dag op zijn gezicht.
tarot.sunkaitlyn=Zonsopgang. Kaitlyn is in de lodge, levend bij het begin van de nieuwe dag.
tarot.sunlaura=Zonsopgang. Laura is op het terrein van de freakshow, levend bij het begin van de nieuwe dag.
tarot.sunlauraisland=Zonsopgang. Laura en Max zijn samen op het eiland, levend bij het begin van de nieuwe dag.
tarot.sunmax=Zonsopgang. Max is op het eiland, levend bij het begin van de nieuwe dag.
tarot.sunryan=Zonsopgang. Ryan is in het bos, levend bij het begin van de nieuwe dag.
tarot.judgement=Laura, Ryan en Travis staan over een gewonde weerwolf heen. Travis stapt op Laura af en grijpt naar het jachtgeweer. Laura schiet op hem en hij valt.
tarot.judgement1=In de keuken van de lodge lokt Kaitlyn een weerwolf met een speeltje en sluit hem op in de koelcel.
tarot.judgement2=Jacob rent door het bos met een weerwolf achter zich aan. De weerwolf loopt in een klem.
tarot.judgement3=Max loopt naar de steiger van het eiland en blijft daar.
