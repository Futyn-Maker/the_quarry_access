; QuarryAccess tarot vision descriptions — Swedish. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob sitter på huk framför minibussen och sliter loss bränsleledningen. Senare fattar motorn eld och minibussen brinner.
tarot.temperance=I lägerbutiken öppnar Emma ett kassaskåp och tar fram fyrverkerier. Senare trycker en varulv ner henne mot marken; hon avfyrar ett fyrverkeri i ansiktet på den, och den slungas av henne.
tarot.thehangedman=Jacob kliver i en snara och hissas upp och ned i ett träd. En jägare kommer och skär ner honom. Jacob kastar jord i ögonen på honom och sliter sig loss.
tarot.thestar=I trädkojan bedövar Emma en varulv med elpistolen och bländar den med blixten från sin telefons kamera.
tarot.tower=Emma flyr från en varulv upp i tornet. Hon hoppar mot linbanan, missar och faller till sin död.
tarot.strength=Nick, som infektionen gjort stark, griper jägaren Bobby om strupen, trycker upp honom mot en dörr och slungar honom åt sidan.
tarot.magician=I radiohyddan sågar Ryan av Dylans bitna arm med en motorsåg.
tarot.devil=Infektionen tar över Nick. Han förvandlas till en varulv och sliter av Abigails huvud.
tarot.hermitfuture=Jacobs ben sitter fast i en björnsax. Han sliter sig loss, faller, och hans huvud hamnar i en andra sax, som dödar honom.
tarot.hermitpast=Vid båthuset släpper Jedediah och Bobby Hackett ner en kropp i sjön. Bobby plockar upp en vandrares ryggsäck.
tarot.justice=På polisstationen brottas Laura med Travis om hans pistol och skjuter honom i magen.
tarot.moon=Laura kör in en gömd spruta med lugnande medel i halsen på Travis.
tarot.chariot=Kaitlyn och Dylan går fram till minibussen. Dylan öppnar dörren medan Kaitlyn täcker honom med hagelgeväret.
tarot.world=Ryan och Laura grälar under bar himmel. Ryan vänder sig bort, marken ger vika under honom och han faller ner i ett hål.
tarot.empress=Constance Hackett tar sig för bröstet. En varulv sliter sönder henne och dödar henne.
tarot.lovers=Ryan ligger sårad. Laura knäböjer bredvid honom och biter honom i armen.
tarot.wheeloffortune=Laura förvandlas till en varulv. En varulv sliter sönder Bobby. Ryan siktar på Laura med ett hagelgevär men skjuter inte, och varulven dödar honom. Travis och Laura dödar varandra.
tarot.emperor=En varulv anfaller Jedediah Hackett och dödar honom.
tarot.kaitlynsdeath=Kaitlyn går på en bjälke högt uppe i huvudbyggnaden. Hon tappar fotfästet och faller till sin död.
tarot.laurasdeath=Laura kryper bort från en kraschad bil. En varulv anfaller henne och dödar henne.
tarot.sunabigail=Soluppgång. Abigail är i rummet fullt av skärmar, vid liv när den nya dagen börjar.
tarot.sundylan=Soluppgång. Dylan är i huvudbyggnaden, vid liv när den nya dagen börjar.
tarot.sunemmaoffice=Soluppgång. Emma är i rummet fullt av skärmar, vid liv när den nya dagen börjar.
tarot.sunemmawoods=Soluppgång. Emma står i skogen med sönderrivna, blodiga kläder, vid liv när den nya dagen börjar.
tarot.sunjacob=Soluppgång. Jacob är i skogen med den nya dagens ljus i ansiktet.
tarot.sunkaitlyn=Soluppgång. Kaitlyn är i huvudbyggnaden, vid liv när den nya dagen börjar.
tarot.sunlaura=Soluppgång. Laura är på freakshowens område, vid liv när den nya dagen börjar.
tarot.sunlauraisland=Soluppgång. Laura och Max är tillsammans på ön, vid liv när den nya dagen börjar.
tarot.sunmax=Soluppgång. Max är på ön, vid liv när den nya dagen börjar.
tarot.sunryan=Soluppgång. Ryan är i skogen, vid liv när den nya dagen börjar.
tarot.judgement=Laura, Ryan och Travis står över en sårad varulv. Travis går mot Laura och sträcker sig efter hagelgeväret. Laura skjuter honom och han faller.
tarot.judgement1=I huvudbyggnadens kök lockar Kaitlyn en varulv med en leksak och stänger in den i kylrummet.
tarot.judgement2=Jacob springer genom skogen med en varulv efter sig. Varulven fastnar i en fälla.
tarot.judgement3=Max går ner till öns brygga och stannar där.
