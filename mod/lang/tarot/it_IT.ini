; QuarryAccess tarot vision descriptions — Italian. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob, accovacciato davanti al furgone, stacca il tubo del carburante. Più tardi il motore prende fuoco e il furgone brucia.
tarot.temperance=Nel negozio del campo, Emma apre una cassaforte e tira fuori dei fuochi d'artificio. Più tardi un lupo mannaro la inchioda a terra; lei gli fa esplodere un fuoco d'artificio in faccia e la creatura viene scaraventata via.
tarot.thehangedman=Jacob mette il piede in un laccio e resta appeso a testa in giù a un albero. Arriva un cacciatore e lo tira giù. Jacob gli getta terra negli occhi e si libera.
tarot.thestar=Nella casa sull'albero, Emma stordisce un lupo mannaro con il taser e lo acceca con il flash della fotocamera del telefono.
tarot.tower=Emma fugge da un lupo mannaro fin sulla torre. Salta verso la teleferica, la manca e cade morendo.
tarot.strength=Nick, con la forza che l'infezione gli dà, afferra il cacciatore Bobby per la gola, lo schiaccia contro una porta e lo scaraventa via.
tarot.magician=Nel capanno della radio, Ryan taglia con una motosega il braccio morso di Dylan.
tarot.devil=L'infezione prende il sopravvento su Nick. Si trasforma in un lupo mannaro e strappa la testa ad Abigail.
tarot.hermitfuture=La gamba di Jacob è stretta in una tagliola per orsi. Si strappa via, cade, e la sua testa finisce in una seconda tagliola, che lo uccide.
tarot.hermitpast=Alla rimessa delle barche, Jedediah e Bobby Hackett gettano un corpo nel lago. Bobby raccoglie lo zaino di un escursionista.
tarot.justice=Nella stazione di polizia, Laura lotta con Travis per la sua pistola e gli spara nello stomaco.
tarot.moon=Laura conficca nel collo di Travis una siringa di tranquillante che teneva nascosta.
tarot.chariot=Kaitlyn e Dylan si avvicinano al furgone. Dylan ne apre la portiera mentre Kaitlyn lo copre con il fucile.
tarot.world=Ryan e Laura litigano all'aperto. Ryan si volta, il terreno cede sotto di lui e precipita in una buca.
tarot.empress=Constance Hackett si porta la mano al petto. Un lupo mannaro la sbrana e la uccide.
tarot.lovers=Ryan giace ferito. Laura si inginocchia accanto a lui e gli morde il braccio.
tarot.wheeloffortune=Laura si trasforma in un lupo mannaro. Un lupo mannaro sbrana Bobby. Ryan punta un fucile contro Laura ma non spara, e il lupo mannaro lo uccide. Travis e Laura si uccidono a vicenda.
tarot.emperor=Un lupo mannaro attacca Jedediah Hackett e lo uccide.
tarot.kaitlynsdeath=Kaitlyn cammina su una trave in alto nel rifugio. Perde l'appoggio e cade morendo.
tarot.laurasdeath=Laura si allontana strisciando da un'auto incidentata. Un lupo mannaro la attacca e la uccide.
tarot.sunabigail=Alba. Abigail è nella stanza piena di monitor, viva all'inizio del nuovo giorno.
tarot.sundylan=Alba. Dylan è nel rifugio, vivo all'inizio del nuovo giorno.
tarot.sunemmaoffice=Alba. Emma è nella stanza piena di monitor, viva all'inizio del nuovo giorno.
tarot.sunemmawoods=Alba. Emma è in piedi nel bosco, con i vestiti strappati e insanguinati, viva all'inizio del nuovo giorno.
tarot.sunjacob=Alba. Jacob è nel bosco, con la luce del nuovo giorno sul viso.
tarot.sunkaitlyn=Alba. Kaitlyn è nel rifugio, viva all'inizio del nuovo giorno.
tarot.sunlaura=Alba. Laura è nel terreno del baraccone dei fenomeni, viva all'inizio del nuovo giorno.
tarot.sunlauraisland=Alba. Laura e Max sono insieme sull'isola, vivi all'inizio del nuovo giorno.
tarot.sunmax=Alba. Max è sull'isola, vivo all'inizio del nuovo giorno.
tarot.sunryan=Alba. Ryan è nel bosco, vivo all'inizio del nuovo giorno.
tarot.judgement=Laura, Ryan e Travis stanno in piedi sopra un lupo mannaro ferito. Travis si avvicina a Laura e allunga la mano verso il fucile. Laura gli spara e lui cade.
tarot.judgement1=Nella cucina del rifugio, Kaitlyn attira un lupo mannaro con un giocattolo e lo chiude nella cella frigorifera.
tarot.judgement2=Jacob corre per la foresta con un lupo mannaro alle calcagna. Il lupo mannaro finisce in una trappola.
tarot.judgement3=Max scende al molo dell'isola e resta lì.
