; QuarryAccess tarot vision descriptions — Turkish. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob minibüsün önüne çömelip yakıt hortumunu söker. Sonra motor alev alır ve minibüs yanar.
tarot.temperance=Kamp dükkânında Emma bir kasayı açıp havai fişekleri çıkarır. Sonra bir yaratık onu yere bastırır; Emma yüzüne bir havai fişek patlatır ve yaratık üzerinden savrulur.
tarot.thehangedman=Jacob bir tuzağa basar ve bir ağaca baş aşağı asılı kalır. Bir avcı gelip onu keser. Jacob avcının gözlerine toprak atıp kurtulur.
tarot.thestar=Ağaç evde Emma bir yaratığı şok tabancasıyla vurur ve telefonunun kamera flaşıyla gözlerini kamaştırır.
tarot.tower=Emma bir yaratıktan kaçarak kuleye çıkar. Zipline halatına atlar, tutamaz ve düşerek ölür.
tarot.strength=Isırığından hasta düşen Nick, ani bir güçle avcıyı boğazından yakalar, bir kapıya bastırır ve kenara fırlatır.
tarot.magician=Telsiz kulübesinde Ryan, Dylan'ın ısırılan kolunu elektrikli testereyle keser.
tarot.devil=Enfeksiyon Nick'i ele geçirir. O yaratıklardan birine dönüşür ve Abigail'in kafasını koparır.
tarot.hermitfuture=Jacob'ın bacağı bir ayı kapanına sıkışmıştır. Kendini kurtarır, düşer ve başı ikinci bir kapana girer; kapan onu öldürür.
tarot.hermitpast=Kayıkhanede avcı Bobby ile yaşlı bir avcı göle bir ceset atar. Bobby bir yürüyüşçünün sırt çantasını alır.
tarot.justice=Polis karakolunda Laura, polisin silahı için onunla boğuşur ve onu karnından vurur.
tarot.moon=Laura, sakladığı şırıngayı polisin boynuna saplar.
tarot.chariot=Kaitlyn ve Dylan minibüse yaklaşır. Kaitlyn pompalı tüfekle onu korurken Dylan kapıyı açar.
tarot.world=Ryan ve Laura açık havada tartışır. Ryan arkasını döner, altındaki zemin çöker ve bir çukura düşer.
tarot.empress=Yaşlı bir kadın göğsünü tutar. Bir kurt adam onu parçalayıp öldürür.
tarot.lovers=Ryan yaralı yatmaktadır. Laura yanına diz çöker ve kolunu ısırır.
tarot.wheeloffortune=Laura kurt adama dönüşür. Bir kurt adam Bobby'yi parçalar. Ryan tüfeğini Laura'ya doğrultur ama ateş etmez ve kurt adam onu öldürür. Travis ile Laura birbirini öldürür.
tarot.emperor=Bir kurt adam yaşlı avcıya saldırıp onu öldürür.
tarot.kaitlynsdeath=Kaitlyn ana binanın tepesindeki bir kirişte yürür. Dengesini kaybeder ve düşerek ölür.
tarot.laurasdeath=Laura kaza yapmış bir arabadan sürünerek uzaklaşır. Bir kurt adam ona saldırıp onu öldürür.
tarot.sunabigail=Gün doğumu. Abigail monitörlerle dolu odada, yeni gün başlarken hayattadır.
tarot.sundylan=Gün doğumu. Dylan ana binada, yeni gün başlarken hayattadır.
tarot.sunemmaoffice=Gün doğumu. Emma monitörlerle dolu odada, yeni gün başlarken hayattadır.
tarot.sunemmawoods=Gün doğumu. Emma yırtık ve kanlı giysilerle ormanda durmaktadır, yeni gün başlarken hayattadır.
tarot.sunjacob=Gün doğumu. Jacob ormandadır, yeni günün ışığı yüzüne vurur.
tarot.sunkaitlyn=Gün doğumu. Kaitlyn ana binada, yeni gün başlarken hayattadır.
tarot.sunlaura=Gün doğumu. Laura ucube gösterisinin alanında, yeni gün başlarken hayattadır.
tarot.sunlauraisland=Gün doğumu. Laura ile Max adada birliktedir, yeni gün başlarken hayattadırlar.
tarot.sunmax=Gün doğumu. Max adada, yeni gün başlarken hayattadır.
tarot.sunryan=Gün doğumu. Ryan ormanda, yeni gün başlarken hayattadır.
tarot.judgement=Laura, Ryan ve Travis yaralı bir kurt adamın başında durur. Travis Laura'ya doğru yürüyüp tüfeğe uzanır. Laura onu vurur ve Travis yere düşer.
tarot.judgement1=Ana binanın mutfağında Kaitlyn bir kurt adamı oyuncakla kandırır ve soğuk hava deposuna kilitler.
tarot.judgement2=Jacob ormanda koşar, peşinde bir kurt adam vardır. Kurt adam bir tuzağa yakalanır.
tarot.judgement3=Max adanın iskelesine iner ve orada kalır.
