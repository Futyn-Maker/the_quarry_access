; QuarryAccess tarot vision descriptions — Finnish. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob kyyristyy pakettiauton keulan luo ja irrottaa polttoaineletkun. Myöhemmin moottori syttyy tuleen ja pakettiauto palaa.
tarot.temperance=Leirin kaupassa Emma avaa kassakaapin ja ottaa esiin ilotulitteita. Myöhemmin ihmissusi painaa hänet maahan; hän laukaisee ilotulitteen sen naamaan, ja se sinkoutuu pois hänen päältään.
tarot.thehangedman=Jacob astuu ansalankaan ja nousee pää alaspäin roikkumaan puuhun. Metsästäjä tulee ja leikkaa hänet irti. Jacob heittää multaa hänen silmiinsä ja pääsee pakoon.
tarot.thestar=Puumajassa Emma lamauttaa ihmissuden etälamauttimella ja sokaisee sen puhelimensa kameran salamalla.
tarot.tower=Emma pakenee ihmissutta torniin. Hän hyppää kohti vaijeriliukua, ei yllä siihen ja putoaa kuolemaansa.
tarot.strength=Tartunnan vahvistama Nick tarttuu metsästäjä Bobbya kurkusta, painaa hänet ovea vasten ja paiskaa hänet sivuun.
tarot.magician=Radiokopissa Ryan katkaisee moottorisahalla Dylanin purrun käsivarren.
tarot.devil=Tartunta ottaa Nickin valtaansa. Hän muuttuu ihmissudeksi ja repii Abigailin pään irti.
tarot.hermitfuture=Jacobin jalka on jäänyt karhunrautoihin. Hän riuhtaisee itsensä irti, kaatuu, ja hänen päänsä osuu toisiin rautoihin, jotka tappavat hänet.
tarot.hermitpast=Venevajalla Jedediah ja Bobby Hackett pudottavat ruumiin järveen. Bobby poimii retkeilijän repun.
tarot.justice=Poliisiasemalla Laura kamppailee Travisin kanssa tämän aseesta ja ampuu häntä vatsaan.
tarot.moon=Laura iskee piilottamansa rauhoittavaa ainetta sisältävän ruiskun Travisin kaulaan.
tarot.chariot=Kaitlyn ja Dylan lähestyvät pakettiautoa. Dylan avaa sen oven Kaitlynin suojatessa häntä haulikolla.
tarot.world=Ryan ja Laura riitelevät ulkona. Ryan kääntyy pois, maa pettää hänen altaan, ja hän putoaa kuoppaan.
tarot.empress=Constance Hackett tarttuu rintaansa. Ihmissusi raatelee hänet kuoliaaksi.
tarot.lovers=Ryan makaa haavoittuneena. Laura polvistuu hänen viereensä ja puree häntä käsivarteen.
tarot.wheeloffortune=Laura muuttuu ihmissudeksi. Ihmissusi raatelee Bobbyn. Ryan tähtää Lauraa haulikolla mutta ei ammu, ja ihmissusi tappaa hänet. Travis ja Laura tappavat toisensa.
tarot.emperor=Ihmissusi hyökkää Jedediah Hackettin kimppuun ja tappaa hänet.
tarot.kaitlynsdeath=Kaitlyn kävelee palkkia pitkin korkealla päärakennuksessa. Hän menettää jalansijansa ja putoaa kuolemaansa.
tarot.laurasdeath=Laura ryömii pois kolaroidun auton luota. Ihmissusi hyökkää hänen kimppuunsa ja tappaa hänet.
tarot.sunabigail=Auringonnousu. Abigail on näyttöjä täynnä olevassa huoneessa, elossa uuden päivän alkaessa.
tarot.sundylan=Auringonnousu. Dylan on päärakennuksessa, elossa uuden päivän alkaessa.
tarot.sunemmaoffice=Auringonnousu. Emma on näyttöjä täynnä olevassa huoneessa, elossa uuden päivän alkaessa.
tarot.sunemmawoods=Auringonnousu. Emma seisoo metsässä vaatteet riekaleina ja veressä, elossa uuden päivän alkaessa.
tarot.sunjacob=Auringonnousu. Jacob on metsässä, uuden päivän valo kasvoillaan.
tarot.sunkaitlyn=Auringonnousu. Kaitlyn on päärakennuksessa, elossa uuden päivän alkaessa.
tarot.sunlaura=Auringonnousu. Laura on friikkisirkuksen alueella, elossa uuden päivän alkaessa.
tarot.sunlauraisland=Auringonnousu. Laura ja Max ovat yhdessä saarella, elossa uuden päivän alkaessa.
tarot.sunmax=Auringonnousu. Max on saarella, elossa uuden päivän alkaessa.
tarot.sunryan=Auringonnousu. Ryan on metsässä, elossa uuden päivän alkaessa.
tarot.judgement=Laura, Ryan ja Travis seisovat haavoittuneen ihmissuden yllä. Travis astuu Lauraa kohti ja kurottaa haulikkoa. Laura ampuu häntä, ja hän kaatuu.
tarot.judgement1=Päärakennuksen keittiössä Kaitlyn houkuttelee ihmissuden lelulla ja sulkee sen kylmiöön.
tarot.judgement2=Jacob juoksee metsän halki ihmissusi perässään. Ihmissusi jää ansaan.
tarot.judgement3=Max kävelee saaren laiturille ja jää sinne.
