; QuarryAccess tarot vision descriptions — Spanish (Spain). One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob, agachado en la parte delantera de la furgoneta, desconecta el tubo del combustible. Más tarde el motor se incendia y la furgoneta arde.
tarot.temperance=En la tienda del campamento, Emma abre una caja fuerte y saca fuegos artificiales. Más tarde una criatura la inmoviliza contra el suelo; ella le hace estallar un fuego artificial en la cara y la criatura sale despedida.
tarot.thehangedman=Jacob pisa un lazo y queda colgado boca abajo de un árbol. Llega un cazador y lo descuelga. Jacob le arroja tierra a los ojos y se suelta.
tarot.thestar=En la casa del árbol, Emma aturde a una criatura con la pistola eléctrica y la ciega con el flash de la cámara de su teléfono.
tarot.tower=Emma huye de una criatura hasta lo alto de la torre. Salta hacia la tirolina, no la alcanza y cae y muere.
tarot.strength=Nick, enfermo por la mordedura, agarra del cuello al cazador con una fuerza repentina, lo aplasta contra una puerta y lo lanza a un lado.
tarot.magician=En la cabaña de radio, Ryan le corta a Dylan el brazo mordido con una motosierra.
tarot.devil=La infección se apodera de Nick. Se transforma en una de esas criaturas y le arranca la cabeza a Abigail.
tarot.hermitfuture=La pierna de Jacob queda atrapada en un cepo para osos. Se libera de un tirón, cae, y su cabeza va a parar a un segundo cepo, que lo mata.
tarot.hermitpast=En el cobertizo de las barcas, el cazador Bobby y un cazador mayor arrojan un cuerpo al lago. Bobby recoge la mochila de un excursionista.
tarot.justice=En la comisaría, Laura forcejea con el policía por su pistola y le dispara en el estómago.
tarot.moon=Laura le clava al policía en el cuello una jeringa que tenía escondida.
tarot.chariot=Kaitlyn y Dylan se acercan a la furgoneta. Dylan abre la puerta mientras Kaitlyn lo cubre con la escopeta.
tarot.world=Ryan y Laura discuten al aire libre. Ryan se da la vuelta, el suelo cede bajo sus pies y cae por un agujero.
tarot.empress=Una anciana se lleva la mano al pecho. Un hombre lobo la destroza y la mata.
tarot.lovers=Ryan yace herido. Laura se arrodilla a su lado y le muerde el brazo.
tarot.wheeloffortune=Laura se transforma en hombre lobo. Un hombre lobo destroza a Bobby. Ryan apunta a Laura con una escopeta pero no dispara, y el hombre lobo lo mata. Travis y Laura se matan el uno al otro.
tarot.emperor=Un hombre lobo ataca al viejo cazador y lo mata.
tarot.kaitlynsdeath=Kaitlyn camina por una viga en lo alto del albergue. Pierde pie y cae y muere.
tarot.laurasdeath=Laura se aleja a rastras de un coche accidentado. Un hombre lobo la ataca y la mata.
tarot.sunabigail=Amanecer. Abigail está en la sala llena de monitores, viva al empezar el nuevo día.
tarot.sundylan=Amanecer. Dylan está en el albergue, vivo al empezar el nuevo día.
tarot.sunemmaoffice=Amanecer. Emma está en la sala llena de monitores, viva al empezar el nuevo día.
tarot.sunemmawoods=Amanecer. Emma está de pie en el bosque, con la ropa rasgada y ensangrentada, viva al empezar el nuevo día.
tarot.sunjacob=Amanecer. Jacob está en el bosque, con la luz del nuevo día en la cara.
tarot.sunkaitlyn=Amanecer. Kaitlyn está en el albergue, viva al empezar el nuevo día.
tarot.sunlaura=Amanecer. Laura está en el recinto de la feria de monstruos, viva al empezar el nuevo día.
tarot.sunlauraisland=Amanecer. Laura y Max están juntos en la isla, vivos al empezar el nuevo día.
tarot.sunmax=Amanecer. Max está en la isla, vivo al empezar el nuevo día.
tarot.sunryan=Amanecer. Ryan está en el bosque, vivo al empezar el nuevo día.
tarot.judgement=Laura, Ryan y Travis están de pie ante un hombre lobo herido. Travis se acerca a Laura y alarga la mano hacia la escopeta. Laura le dispara y él cae.
tarot.judgement1=En la cocina del albergue, Kaitlyn atrae a un hombre lobo con un juguete y lo encierra en la cámara frigorífica.
tarot.judgement2=Jacob corre por el bosque con un hombre lobo detrás. El hombre lobo cae en un cepo.
tarot.judgement3=Max baja hasta el muelle de la isla y se queda allí.
