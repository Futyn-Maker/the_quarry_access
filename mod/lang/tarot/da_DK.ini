; QuarryAccess tarot vision descriptions — Danish. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob sidder på hug foran minibussen og river brændstofslangen løs. Senere bryder motoren i brand, og minibussen brænder.
tarot.temperance=I campbutikken åbner Emma et pengeskab og tager fyrværkeri ud. Senere presser en varulv hende ned mod jorden; hun fyrer et stykke fyrværkeri af i ansigtet på den, og den bliver slynget væk fra hende.
tarot.thehangedman=Jacob træder i en snare og hejses med hovedet nedad op i et træ. En jæger kommer og skærer ham ned. Jacob kaster jord i øjnene på ham og slipper fri.
tarot.thestar=I træhytten lammer Emma en varulv med strømpistolen og blænder den med blitzen fra sin telefons kamera.
tarot.tower=Emma flygter fra en varulv op i tårnet. Hun springer efter svævebanen, rammer forbi og styrter i døden.
tarot.strength=Nick, som infektionen har gjort stærk, griber jægeren Bobby om halsen, presser ham op mod en dør og slynger ham til side.
tarot.magician=I radiohytten saver Ryan Dylans bidte arm af med en motorsav.
tarot.devil=Infektionen tager magten over Nick. Han forvandles til en varulv og river hovedet af Abigail.
tarot.hermitfuture=Jacobs ben sidder fast i en bjørnefælde. Han river sig løs, falder, og hans hoved lander i endnu en fælde, som dræber ham.
tarot.hermitpast=Ved bådehuset smider Jedediah og Bobby Hackett et lig i søen. Bobby samler en vandrers rygsæk op.
tarot.justice=På politistationen kæmper Laura med Travis om hans pistol og skyder ham i maven.
tarot.moon=Laura jager en skjult sprøjte med bedøvelsesmiddel i halsen på Travis.
tarot.chariot=Kaitlyn og Dylan går hen til minibussen. Dylan åbner døren, mens Kaitlyn dækker ham med haglgeværet.
tarot.world=Ryan og Laura skændes under åben himmel. Ryan vender sig bort, jorden giver efter under ham, og han falder ned i et hul.
tarot.empress=Constance Hackett griber sig til brystet. En varulv sønderriver hende og dræber hende.
tarot.lovers=Ryan ligger såret. Laura knæler ved siden af ham og bider ham i armen.
tarot.wheeloffortune=Laura forvandles til en varulv. En varulv sønderriver Bobby. Ryan sigter på Laura med et haglgevær, men skyder ikke, og varulven dræber ham. Travis og Laura dræber hinanden.
tarot.emperor=En varulv angriber Jedediah Hackett og dræber ham.
tarot.kaitlynsdeath=Kaitlyn går ud på en bjælke højt oppe i hovedhuset. Hun mister fodfæstet og styrter i døden.
tarot.laurasdeath=Laura kravler væk fra en forulykket bil. En varulv angriber hende og dræber hende.
tarot.sunabigail=Solopgang. Abigail er i rummet fuldt af skærme, i live, da den nye dag begynder.
tarot.sundylan=Solopgang. Dylan er i hovedhuset, i live, da den nye dag begynder.
tarot.sunemmaoffice=Solopgang. Emma er i rummet fuldt af skærme, i live, da den nye dag begynder.
tarot.sunemmawoods=Solopgang. Emma står i skoven med flænget og blodigt tøj, i live, da den nye dag begynder.
tarot.sunjacob=Solopgang. Jacob er i skoven med den nye dags lys i ansigtet.
tarot.sunkaitlyn=Solopgang. Kaitlyn er i hovedhuset, i live, da den nye dag begynder.
tarot.sunlaura=Solopgang. Laura er på freakshowets grund, i live, da den nye dag begynder.
tarot.sunlauraisland=Solopgang. Laura og Max er sammen på øen, i live, da den nye dag begynder.
tarot.sunmax=Solopgang. Max er på øen, i live, da den nye dag begynder.
tarot.sunryan=Solopgang. Ryan er i skoven, i live, da den nye dag begynder.
tarot.judgement=Laura, Ryan og Travis står over en såret varulv. Travis går hen mod Laura og rækker ud efter haglgeværet. Laura skyder ham, og han falder.
tarot.judgement1=I hovedhusets køkken lokker Kaitlyn en varulv med et legetøj og lukker den inde i kølerummet.
tarot.judgement2=Jacob løber gennem skoven med en varulv efter sig. Varulven fanges i en fælde.
tarot.judgement3=Max går ned til øens bådebro og bliver der.
