; QuarryAccess tarot vision descriptions — Japanese. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=ジェイコブがミニバンの前にかがみ込み、燃料ホースを外す。のちにエンジンが火を噴き、ミニバンが燃える。
tarot.temperance=キャンプ場倉庫でエマが金庫を開け、花火を取り出す。のちに怪物がエマを地面に押さえつけるが、エマが花火をその顔に向けて点火し、怪物は吹き飛ばされる。
tarot.thehangedman=ジェイコブが罠の輪に足を取られ、木に逆さ吊りにされる。ハンターがやって来て縄を切る。ジェイコブはハンターの目に土を投げつけ、逃げ出す。
tarot.thestar=ツリーハウスでエマが怪物にスタンガンを当て、携帯電話のカメラのフラッシュで目をくらませる。
tarot.tower=エマが怪物から逃げて塔を登る。ジップラインに飛びつくが届かず、転落して死ぬ。
tarot.strength=噛み傷で弱っていたニックが突然の力でハンターの喉をつかみ、扉に押しつけて投げ飛ばす。
tarot.magician=無線小屋でライアンがチェーンソーでディランの噛まれた腕を切り落とす。
tarot.devil=感染がニックを支配する。ニックはあの怪物の一体に変身し、アビーの頭を引きちぎる。
tarot.hermitfuture=ジェイコブの脚がクマ用の罠に挟まれる。力ずくで抜け出して倒れ、頭が二つ目の罠にかかり、命を落とす。
tarot.hermitpast=ボート小屋でハンターのボビーと年老いたハンターが死体を湖に落とす。ボビーがハイカーのリュックを拾い上げる。
tarot.justice=警察署でローラが警官と拳銃を奪い合い、彼の腹を撃つ。
tarot.moon=ローラが隠し持っていた注射器を警官の首に突き立てる。
tarot.chariot=ケイトリンとディランがミニバンに近づく。ケイトリンがショットガンで援護し、ディランがドアを開ける。
tarot.world=ライアンとローラが屋外で言い争う。ライアンが背を向けると足元の地面が崩れ、穴に落ちる。
tarot.empress=年老いた女性が胸を押さえる。狼男が彼女を引き裂いて殺す。
tarot.lovers=ライアンが負傷して横たわる。ローラがそばにひざまずき、彼の腕を噛む。
tarot.wheeloffortune=ローラが狼男に変身する。狼男がボビーを引き裂く。ライアンがローラにショットガンを向けるが撃たず、狼男に殺される。トラビスとローラが殺し合う。
tarot.emperor=狼男が年老いたハンターを襲い、殺す。
tarot.kaitlynsdeath=ケイトリンがロッジの高い梁の上を歩く。足を踏み外し、転落して死ぬ。
tarot.laurasdeath=ローラが衝突した車から這って離れる。狼男が襲いかかり、彼女を殺す。
tarot.sunabigail=日の出。アビーはモニターだらけの部屋にいて、新しい日の始まりに生きている。
tarot.sundylan=日の出。ディランはロッジにいて、新しい日の始まりに生きている。
tarot.sunemmaoffice=日の出。エマはモニターだらけの部屋にいて、新しい日の始まりに生きている。
tarot.sunemmawoods=日の出。エマは服を裂かれ血にまみれて森に立ち、新しい日の始まりに生きている。
tarot.sunjacob=日の出。ジェイコブは森にいて、その顔に新しい日の光が差す。
tarot.sunkaitlyn=日の出。ケイトリンはロッジにいて、新しい日の始まりに生きている。
tarot.sunlaura=日の出。ローラは見世物小屋の跡地にいて、新しい日の始まりに生きている。
tarot.sunlauraisland=日の出。ローラとマックスは島で一緒にいて、新しい日の始まりに生きている。
tarot.sunmax=日の出。マックスは島にいて、新しい日の始まりに生きている。
tarot.sunryan=日の出。ライアンは森にいて、新しい日の始まりに生きている。
tarot.judgement=ローラ、ライアン、トラビスが傷ついた狼男を見下ろして立つ。トラビスがローラに歩み寄り、ショットガンに手を伸ばす。ローラが彼を撃ち、トラビスは倒れる。
tarot.judgement1=ロッジの厨房でケイトリンがおもちゃで狼男をおびき寄せ、冷凍室に閉じ込める。
tarot.judgement2=ジェイコブが森を走り、狼男が追ってくる。狼男が罠にかかる。
tarot.judgement3=マックスが島の桟橋へ下りていき、そこにとどまる。
