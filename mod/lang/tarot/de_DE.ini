; QuarryAccess tarot vision descriptions — German. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob hockt vor dem Minivan und zieht die Benzinleitung ab. Später fängt der Motor Feuer, und der Minivan brennt.
tarot.temperance=Im Camp-Laden öffnet Emma einen Safe und nimmt Feuerwerkskörper heraus. Später drückt eine Kreatur Emma zu Boden; Emma zündet ihr einen Feuerwerkskörper ins Gesicht, und die Kreatur wird weggeschleudert.
tarot.thehangedman=Jacob tritt in eine Schlinge und wird kopfüber an einem Baum hochgezogen. Ein Jäger kommt und schneidet ihn los. Jacob wirft ihm Erde in die Augen und reißt sich los.
tarot.thestar=Im Baumhaus setzt Emma eine Kreatur mit dem Elektroschocker außer Gefecht und blendet sie mit dem Blitz ihrer Handykamera.
tarot.tower=Emma flieht vor einer Kreatur den Turm hinauf. Sie springt nach der Seilrutsche, verfehlt sie und stürzt in den Tod.
tarot.strength=Nick, krank von seinem Biss, packt den Jäger mit plötzlicher Kraft an der Kehle, drückt ihn gegen eine Tür und schleudert ihn beiseite.
tarot.magician=Im Radioschuppen trennt Ryan Dylans gebissenen Arm mit einer Kettensäge ab.
tarot.devil=Die Infektion übernimmt Nick. Er verwandelt sich in eine dieser Kreaturen und reißt Abigail den Kopf ab.
tarot.hermitfuture=Jacobs Bein steckt in einer Bärenfalle. Er reißt sich los, stürzt, und sein Kopf landet in einer zweiten Falle, die ihn tötet.
tarot.hermitpast=Am Bootshaus werfen der Jäger Bobby und ein älterer Jäger eine Leiche in den See. Bobby hebt den Rucksack eines Wanderers auf.
tarot.justice=Auf der Polizeiwache ringt Laura mit dem Polizisten um seine Pistole und schießt ihm in den Bauch.
tarot.moon=Laura rammt dem Polizisten eine versteckte Spritze in den Hals.
tarot.chariot=Kaitlyn und Dylan nähern sich dem Minivan. Dylan öffnet die Tür, während Kaitlyn ihm mit der Schrotflinte Deckung gibt.
tarot.world=Ryan und Laura streiten unter freiem Himmel. Ryan wendet sich ab, der Boden gibt unter ihm nach, und er stürzt in ein Loch.
tarot.empress=Die alte Frau aus dem Haus der Hacketts greift sich an die Brust. Ein Werwolf zerfleischt sie und tötet sie.
tarot.lovers=Ryan liegt verwundet da. Laura kniet sich neben ihn und beißt ihn in den Arm.
tarot.wheeloffortune=Laura verwandelt sich in einen Werwolf. Ein Werwolf zerfleischt Bobby. Ryan richtet eine Schrotflinte auf Laura, schießt aber nicht, und der Werwolf tötet ihn. Travis und Laura töten einander.
tarot.emperor=Ein Werwolf greift den alten Jäger an und tötet ihn.
tarot.kaitlynsdeath=Kaitlyn geht hoch oben in der Lodge über einen Balken. Sie verliert den Halt und stürzt in den Tod.
tarot.laurasdeath=Laura kriecht von einem verunglückten Auto weg. Ein Werwolf greift sie an und tötet sie.
tarot.sunabigail=Sonnenaufgang. Abigail ist im Raum voller Monitore, am Leben, als der neue Tag beginnt.
tarot.sundylan=Sonnenaufgang. Dylan ist in der Lodge, am Leben, als der neue Tag beginnt.
tarot.sunemmaoffice=Sonnenaufgang. Emma ist im Raum voller Monitore, am Leben, als der neue Tag beginnt.
tarot.sunemmawoods=Sonnenaufgang. Emma steht im Wald, die Kleidung zerrissen und blutig, am Leben, als der neue Tag beginnt.
tarot.sunjacob=Sonnenaufgang. Jacob ist im Wald, das Licht des neuen Tages auf seinem Gesicht.
tarot.sunkaitlyn=Sonnenaufgang. Kaitlyn ist in der Lodge, am Leben, als der neue Tag beginnt.
tarot.sunlaura=Sonnenaufgang. Laura ist auf dem Gelände der Freakshow, am Leben, als der neue Tag beginnt.
tarot.sunlauraisland=Sonnenaufgang. Laura und Max sind zusammen auf der Insel, am Leben, als der neue Tag beginnt.
tarot.sunmax=Sonnenaufgang. Max ist auf der Insel, am Leben, als der neue Tag beginnt.
tarot.sunryan=Sonnenaufgang. Ryan ist im Wald, am Leben, als der neue Tag beginnt.
tarot.judgement=Laura, Ryan und Travis stehen über einem verwundeten Werwolf. Travis tritt auf Laura zu und greift nach der Schrotflinte. Laura schießt auf ihn, und er fällt.
tarot.judgement1=In der Küche der Lodge lockt Kaitlyn einen Werwolf mit einem Spielzeug an und sperrt ihn in die Kühlkammer.
tarot.judgement2=Jacob rennt durch den Wald, ein Werwolf hinter ihm her. Der Werwolf gerät in eine Falle.
tarot.judgement3=Max geht zum Steg der Insel hinunter und bleibt dort.
