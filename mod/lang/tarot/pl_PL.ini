; QuarryAccess tarot vision descriptions — Polish. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob kuca przy przodzie minivana i odłącza przewód paliwowy. Później silnik zajmuje się ogniem i minivan płonie.
tarot.temperance=W sklepie obozowym Emma otwiera sejf i wyjmuje fajerwerki. Później wilkołak przygniata ją do ziemi; odpala mu fajerwerk prosto w pysk i bestia zostaje odrzucona.
tarot.thehangedman=Jacob wchodzi w sidła i zawisa głową w dół na drzewie. Nadchodzi myśliwy i go odcina. Jacob rzuca mu ziemią w oczy i wyrywa się.
tarot.thestar=W domku na drzewie Emma obezwładnia wilkołaka paralizatorem i oślepia go lampą błyskową aparatu w telefonie.
tarot.tower=Emma ucieka przed wilkołakiem na szczyt wieży. Skacze do liny zjazdowej, chybia i spada, ginąc na miejscu.
tarot.strength=Nick, któremu zakażenie dodało sił, chwyta myśliwego Bobby'ego za gardło, przyciska go do drzwi i odrzuca na bok.
tarot.magician=W radiowęźle Ryan odcina piłą łańcuchową pogryzione ramię Dylana.
tarot.devil=Zakażenie bierze górę nad Nickiem. Zmienia się w wilkołaka i odrywa Abigail głowę.
tarot.hermitfuture=Noga Jacoba tkwi w potrzasku na niedźwiedzie. Wyrywa się, upada, a jego głowa trafia w drugi potrzask, który go zabija.
tarot.hermitpast=Przy hangarze na łodzie Jedediah i Bobby Hackettowie wrzucają ciało do jeziora. Bobby podnosi plecak wędrowca.
tarot.justice=Na posterunku policji Laura szarpie się z Travisem o jego pistolet i strzela mu w brzuch.
tarot.moon=Laura wbija Travisowi w szyję ukrytą strzykawkę ze środkiem usypiającym.
tarot.chariot=Kaitlyn i Dylan podchodzą do minivana. Dylan otwiera drzwi, a Kaitlyn osłania go strzelbą.
tarot.world=Ryan i Laura kłócą się pod gołym niebem. Ryan odwraca się, ziemia pod nim się zapada i wpada do dziury.
tarot.empress=Constance Hackett chwyta się za pierś. Wilkołak rozszarpuje ją i zabija.
tarot.lovers=Ryan leży ranny. Laura klęka przy nim i gryzie go w ramię.
tarot.wheeloffortune=Laura zmienia się w wilkołaka. Wilkołak rozszarpuje Bobby'ego. Ryan celuje do Laury ze strzelby, ale nie strzela, i wilkołak go zabija. Travis i Laura zabijają się nawzajem.
tarot.emperor=Wilkołak atakuje Jedediaha Hacketta i go zabija.
tarot.kaitlynsdeath=Kaitlyn idzie po belce wysoko pod dachem głównego domu. Traci równowagę i spada, ginąc na miejscu.
tarot.laurasdeath=Laura odczołguje się od rozbitego samochodu. Wilkołak atakuje ją i zabija.
tarot.sunabigail=Wschód słońca. Abigail jest w pokoju pełnym monitorów, żywa u progu nowego dnia.
tarot.sundylan=Wschód słońca. Dylan jest w głównym domu, żywy u progu nowego dnia.
tarot.sunemmaoffice=Wschód słońca. Emma jest w pokoju pełnym monitorów, żywa u progu nowego dnia.
tarot.sunemmawoods=Wschód słońca. Emma stoi w lesie w podartym, zakrwawionym ubraniu, żywa u progu nowego dnia.
tarot.sunjacob=Wschód słońca. Jacob jest w lesie, światło nowego dnia pada na jego twarz.
tarot.sunkaitlyn=Wschód słońca. Kaitlyn jest w głównym domu, żywa u progu nowego dnia.
tarot.sunlaura=Wschód słońca. Laura jest na terenie wędrownego cyrku osobliwości, żywa u progu nowego dnia.
tarot.sunlauraisland=Wschód słońca. Laura i Max są razem na wyspie, żywi u progu nowego dnia.
tarot.sunmax=Wschód słońca. Max jest na wyspie, żywy u progu nowego dnia.
tarot.sunryan=Wschód słońca. Ryan jest w lesie, żywy u progu nowego dnia.
tarot.judgement=Laura, Ryan i Travis stoją nad rannym wilkołakiem. Travis podchodzi do Laury i sięga po strzelbę. Laura strzela do niego i Travis pada.
tarot.judgement1=W kuchni głównego domu Kaitlyn wabi wilkołaka zabawką i zamyka go w chłodni.
tarot.judgement2=Jacob biegnie przez las, a wilkołak go ściga. Wilkołak wpada w potrzask.
tarot.judgement3=Max schodzi na pomost na wyspie i tam zostaje.
