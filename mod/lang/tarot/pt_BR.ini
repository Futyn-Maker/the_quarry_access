; QuarryAccess tarot vision descriptions — Portuguese (Brazil). One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob, agachado na frente da van, solta a mangueira de combustível. Mais tarde o motor pega fogo e a van queima.
tarot.temperance=Na loja do acampamento, Emma abre um cofre e tira fogos de artifício. Mais tarde um lobisomem a prende no chão; ela dispara um fogo na cara dele e a criatura é lançada para longe.
tarot.thehangedman=Jacob pisa em um laço e é içado de cabeça para baixo em uma árvore. Um caçador chega e o solta. Jacob joga terra nos olhos dele e escapa.
tarot.thestar=Na casa da árvore, Emma atinge um lobisomem com o taser e o cega com o flash da câmera do celular.
tarot.tower=Emma foge de um lobisomem até o alto da torre. Ela salta para a tirolesa, erra e cai para a morte.
tarot.strength=Nick, com a força que a infecção lhe dá, agarra o caçador Bobby pela garganta, prensa-o contra uma porta e o joga para o lado.
tarot.magician=Na cabine de rádio, Ryan corta com uma motosserra o braço mordido de Dylan.
tarot.devil=A infecção toma conta de Nick. Ele se transforma em lobisomem e arranca a cabeça de Abigail.
tarot.hermitfuture=A perna de Jacob fica presa em uma armadilha para ursos. Ele se solta à força, cai, e sua cabeça vai parar em uma segunda armadilha, que o mata.
tarot.hermitpast=No estaleiro, Jedediah e Bobby Hackett jogam um corpo no lago. Bobby pega a mochila de um andarilho.
tarot.justice=Na delegacia, Laura luta com Travis pela arma dele e atira na barriga dele.
tarot.moon=Laura crava no pescoço de Travis uma seringa de tranquilizante que mantinha escondida.
tarot.chariot=Kaitlyn e Dylan se aproximam da van. Dylan abre a porta enquanto Kaitlyn o cobre com a espingarda.
tarot.world=Ryan e Laura discutem ao ar livre. Ryan se vira, o chão cede sob ele e ele cai em um buraco.
tarot.empress=Constance Hackett leva a mão ao peito. Um lobisomem a dilacera e a mata.
tarot.lovers=Ryan está caído, ferido. Laura se ajoelha ao lado dele e morde seu braço.
tarot.wheeloffortune=Laura se transforma em lobisomem. Um lobisomem dilacera Bobby. Ryan aponta uma espingarda para Laura, mas não atira, e o lobisomem o mata. Travis e Laura matam um ao outro.
tarot.emperor=Um lobisomem ataca Jedediah Hackett e o mata.
tarot.kaitlynsdeath=Kaitlyn anda por uma viga no alto do refúgio. Ela perde o equilíbrio e cai para a morte.
tarot.laurasdeath=Laura se arrasta para longe de um carro batido. Um lobisomem a ataca e a mata.
tarot.sunabigail=Amanhecer. Abigail está na sala cheia de monitores, viva no início do novo dia.
tarot.sundylan=Amanhecer. Dylan está no refúgio, vivo no início do novo dia.
tarot.sunemmaoffice=Amanhecer. Emma está na sala cheia de monitores, viva no início do novo dia.
tarot.sunemmawoods=Amanhecer. Emma está de pé na mata, com as roupas rasgadas e ensanguentadas, viva no início do novo dia.
tarot.sunjacob=Amanhecer. Jacob está na mata, com a luz do novo dia no rosto.
tarot.sunkaitlyn=Amanhecer. Kaitlyn está no refúgio, viva no início do novo dia.
tarot.sunlaura=Amanhecer. Laura está no terreno do show de horrores, viva no início do novo dia.
tarot.sunlauraisland=Amanhecer. Laura e Max estão juntos na ilha, vivos no início do novo dia.
tarot.sunmax=Amanhecer. Max está na ilha, vivo no início do novo dia.
tarot.sunryan=Amanhecer. Ryan está na mata, vivo no início do novo dia.
tarot.judgement=Laura, Ryan e Travis estão de pé diante de um lobisomem ferido. Travis avança para Laura e estende a mão para a espingarda. Laura atira nele e ele cai.
tarot.judgement1=Na cozinha do refúgio, Kaitlyn atrai um lobisomem com um brinquedo e o tranca na câmara fria.
tarot.judgement2=Jacob corre pela floresta com um lobisomem atrás dele. O lobisomem cai em uma armadilha.
tarot.judgement3=Max desce até o píer da ilha e fica lá.
