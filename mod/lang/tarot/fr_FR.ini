; QuarryAccess tarot vision descriptions — French. One entry per vision film the game plays in the
; crystal ball; the key is the film's name. Every language file must contain the same keys.
[strings]
tarot.thefool=Jacob est accroupi à l'avant du minivan et détache la conduite de carburant. Plus tard, le moteur prend feu et le minivan brûle.
tarot.temperance=Dans l'épicerie du camp, Emma ouvre un coffre et en sort des feux d'artifice. Plus tard, un loup-garou la plaque au sol ; elle lui fait exploser un feu d'artifice au visage et il est projeté loin d'elle.
tarot.thehangedman=Jacob met le pied dans un collet et se retrouve suspendu à un arbre, la tête en bas. Un chasseur arrive et le détache. Jacob lui jette de la terre dans les yeux et s'échappe.
tarot.thestar=Dans la cabane, Emma neutralise un loup-garou avec le taser et l'aveugle avec le flash de l'appareil photo de son téléphone.
tarot.tower=Emma fuit un loup-garou jusqu'en haut de la tour. Elle saute vers la tyrolienne, la manque et fait une chute mortelle.
tarot.strength=Nick, dont l'infection décuple la force, saisit le chasseur Bobby à la gorge, le plaque contre une porte et le projette au loin.
tarot.magician=Dans le local radio, Ryan coupe à la tronçonneuse le bras mordu de Dylan.
tarot.devil=L'infection prend le dessus sur Nick. Il se transforme en loup-garou et arrache la tête d'Abigail.
tarot.hermitfuture=La jambe de Jacob est prise dans un piège à ours. Il s'arrache au piège, tombe, et sa tête atterrit dans un second piège, qui le tue.
tarot.hermitpast=Au hangar à bateaux, Jedediah et Bobby Hackett jettent un corps dans le lac. Bobby ramasse le sac à dos d'un randonneur.
tarot.justice=Au poste de police, Laura se bat avec Travis pour son pistolet et lui tire dans le ventre.
tarot.moon=Laura plante dans le cou de Travis une seringue de tranquillisant qu'elle avait cachée.
tarot.chariot=Kaitlyn et Dylan s'approchent du minivan. Dylan en ouvre la porte pendant que Kaitlyn le couvre avec le fusil.
tarot.world=Ryan et Laura se disputent en plein air. Ryan se détourne, le sol cède sous lui et il tombe dans un trou.
tarot.empress=Constance Hackett porte la main à sa poitrine. Un loup-garou la déchiquette et la tue.
tarot.lovers=Ryan est allongé, blessé. Laura s'agenouille près de lui et le mord au bras.
tarot.wheeloffortune=Laura se transforme en loup-garou. Un loup-garou déchiquette Bobby. Ryan vise Laura avec un fusil mais ne tire pas, et le loup-garou le tue. Travis et Laura s'entretuent.
tarot.emperor=Un loup-garou attaque Jedediah Hackett et le tue.
tarot.kaitlynsdeath=Kaitlyn avance sur une poutre, tout en haut du chalet. Elle perd l'équilibre et fait une chute mortelle.
tarot.laurasdeath=Laura s'éloigne en rampant d'une voiture accidentée. Un loup-garou l'attaque et la tue.
tarot.sunabigail=Lever du soleil. Abigail est dans la pièce pleine d'écrans, vivante au début du nouveau jour.
tarot.sundylan=Lever du soleil. Dylan est dans le chalet, vivant au début du nouveau jour.
tarot.sunemmaoffice=Lever du soleil. Emma est dans la pièce pleine d'écrans, vivante au début du nouveau jour.
tarot.sunemmawoods=Lever du soleil. Emma est debout dans les bois, les vêtements déchirés et ensanglantés, vivante au début du nouveau jour.
tarot.sunjacob=Lever du soleil. Jacob est dans les bois, la lumière du nouveau jour sur le visage.
tarot.sunkaitlyn=Lever du soleil. Kaitlyn est dans le chalet, vivante au début du nouveau jour.
tarot.sunlaura=Lever du soleil. Laura est sur le terrain de la foire aux monstres, vivante au début du nouveau jour.
tarot.sunlauraisland=Lever du soleil. Laura et Max sont ensemble sur l'île, vivants au début du nouveau jour.
tarot.sunmax=Lever du soleil. Max est sur l'île, vivant au début du nouveau jour.
tarot.sunryan=Lever du soleil. Ryan est dans les bois, vivant au début du nouveau jour.
tarot.judgement=Laura, Ryan et Travis se tiennent au-dessus d'un loup-garou blessé. Travis s'avance vers Laura et tend la main vers le fusil. Laura lui tire dessus et il s'effondre.
tarot.judgement1=Dans la cuisine du chalet, Kaitlyn attire un loup-garou avec un jouet et l'enferme dans la chambre froide.
tarot.judgement2=Jacob court à travers la forêt, un loup-garou à ses trousses. Le loup-garou est pris dans un piège.
tarot.judgement3=Max descend jusqu'au ponton de l'île et y reste.
