help.combat=Aim with the mouse or the right stick; the game shows your aim as the torch beam on the weapon. The blips sound in the ear on the side of the target, higher when it is above the beam and lower when below, and come faster as the beam nears it; a quick double ping means the beam is on the target and the shot would land. {0} fires. {1} and {2} switch between targets, {3} turns the aim sound off and on.
