help.combat=用滑鼠或右搖桿瞄準；遊戲用武器上手電筒的光束顯示你的瞄準方向。提示音在目標所在一側的耳中響起，目標在光束上方時音調更高，在下方時更低，光束越接近目標響得越快；急促的雙響表示光束正落在目標上，此刻開槍會命中。{0} 開槍。{1} 和 {2} 切換目標，{3} 關閉或開啟瞄準提示音。
