help.combat=Apunta con el ratón o el stick derecho; el juego muestra tu puntería como el haz de la linterna del arma. Los pitidos suenan en el oído del lado del objetivo, más agudos cuando está por encima del haz y más graves cuando está por debajo, y se aceleran a medida que el haz se acerca; un doble pitido rápido significa que el haz está sobre el objetivo y el disparo acertaría. {0} dispara. {1} y {2} cambian de objetivo, {3} apaga y enciende el sonido de puntería.
