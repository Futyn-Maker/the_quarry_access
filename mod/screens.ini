; The text on the screens of the game's scenes. The game draws these screens as pictures,
; not as text, so this file carries what each picture says, word for word, under the name
; of the material that shows it. The pictures exist in English only, in every language of
; the game, so the text is English here too. The headlines are the newspaper's capitals set
; in ordinary case, and the misspellings are the game's own.
